// ---------- color + geometry helpers ----------
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');};
const f=n=>n.toFixed(1);
const qpt=(t,a,b,c)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*b[0]+t*t*c[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*b[1]+t*t*c[1]];
function ell(cx,cy,rx,ry,a0,a1,n){const p=[];for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;p.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}return p;}
function resample(pts,sp){
  const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const T=d[d.length-1];if(T<1)return [pts[0],pts[pts.length-1]];
  const n=Math.max(1,Math.round(T/sp)),out=[];let j=1;
  for(let k=0;k<=n;k++){const s=T*k/n;while(j<d.length-1&&d[j]<s)j++;const t=(s-d[j-1])/((d[j]-d[j-1])||1);
    out.push([pts[j-1][0]+(pts[j][0]-pts[j-1][0])*t,pts[j-1][1]+(pts[j][1]-pts[j-1][1])*t]);}
  return out;
}
function smooth(p){let s="";for(let i=0;i<p.length-1;i++){const a=p[Math.max(i-1,0)],b=p[i],c=p[i+1],d=p[Math.min(i+2,p.length-1)];
  s+=`C${f(b[0]+(c[0]-a[0])/6)} ${f(b[1]+(c[1]-a[1])/6)} ${f(c[0]-(d[0]-b[0])/6)} ${f(c[1]-(d[1]-b[1])/6)} ${f(c[0])} ${f(c[1])} `;}return s;}
const nrm=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return [dy/l,-dx/l];}; // outward for clockwise paths
// texturize an ordered point list; returns path commands continuing from p[0]
function tex(p,type,opt={}){
  if(Math.hypot(p[0][0]-p[p.length-1][0],p[0][1]-p[p.length-1][1])<2&&p.length<3)return "";
  if(type==="sharp")return p.slice(1).map(q=>`L${f(q[0])} ${f(q[1])}`).join(' ');
  if(type==="straight")return smooth(p);
  if(type==="wavy"){const r=resample(p,3),amp=opt.amp||3.5,lam=opt.lam||30;let s=0;const T=r.length*3;
    const o=r.map((q,i)=>{if(i)s+=Math.hypot(q[0]-r[i-1][0],q[1]-r[i-1][1]);const n=nrm(r[Math.max(i-1,0)],r[Math.min(i+1,r.length-1)]),k=Math.min(1,s/12,(T-s)/12)*amp*Math.sin(2*Math.PI*s/lam);return [q[0]+n[0]*k,q[1]+n[1]*k];});
    return smooth(o);}
  if(type==="curly"||type==="coily"){const r=resample(p,opt.sp||(type==="coily"?10:13));let s="";
    for(let i=1;i<r.length;i++){const d=Math.hypot(r[i][0]-r[i-1][0],r[i][1]-r[i-1][1]);s+=`A${f(d*.6)} ${f(d*.6)} 0 0 1 ${f(r[i][0])} ${f(r[i][1])} `;}return s;}
  if(type==="spiky"){const r=resample(p,opt.sp||15),tip=opt.tip||12;let s="";
    for(let i=1;i<r.length;i++){const a=r[i-1],b=r[i],n=nrm(a,b),k=tip*(1+.35*Math.sin(i*2.7)),lean=.25*Math.sin(i*1.9);
      const m=[(a[0]+b[0])/2+(b[0]-a[0])*lean,(a[1]+b[1])/2+(b[1]-a[1])*lean];
      s+=`L${f(m[0]+n[0]*k)} ${f(m[1]+n[1]*k)} L${f(b[0])} ${f(b[1])} `;}return s;}
  return smooth(p);
}
const VOL={straight:[0,0],wavy:[3,3],curly:[9,8],coily:[18,20],spiky:[4,4]};
const LEN=[{ly:118,bl:112},{ly:150,bl:148},{ly:186,bl:192},{ly:228,bl:200},{ly:104,bl:176}];
const FR={
  side:[[152,118],[150,96],[140,80],[124,70],[104,68],[84,74],[66,88],[54,104],[48,118]],
  bangs:[[152,118],[151,100],[149,89],[124,92],[100,93],[76,92],[51,89],[49,100],[48,118]],
  curtains:[[152,118],[148,96],[136,80],[118,68],[100,62],[82,68],[64,80],[52,96],[48,118]],
  choppy:[[152,118],[150,98],[142,108],[136,88],[126,106],[118,86],[108,104],[100,86],[90,102],[84,86],[74,100],[66,86],[56,100],[48,118]],
  crop:[[152,118],[152,98],[144,80],[140,94],[126,76],[116,92],[104,72],[92,90],[80,74],[70,92],[60,80],[52,98],[48,118]],
  emo:[[152,118],[150,92],[140,76],[126,68],[120,80],[112,72],[106,90],[98,84],[92,104],[86,96],[80,120],[73,110],[66,130],[60,120],[52,126],[48,118]],
  none:[[152,118],[150,92],[138,72],[120,62],[100,60],[80,62],[62,72],[50,92],[48,118]]
};

// generic hair: texture x length x fringe
function genHair(type,li,fringe,hc,hs,o={}){
  const [vx,vy]=o.vol||VOL[type],{ly,bl}=LEN[li],fl=type==="straight"?0:3;
  const line=mix(hc,hs,.6);
  const shade=type==="spiky"?mix(hc,hs,.2):type==="straight"?mix(hc,hs,.18):mix(hc,hs,.1),light=mix(hc,"#ffffff",.35);
  const bo=type==="spiky"?{sp:o.bsp||18,tip:o.btip||14}:type==="curly"?{sp:15}:type==="coily"?{sp:16}:{};
  // back silhouette (clockwise)
  const bpts=li===4
    ? [[56,138],[44,100],...ell(100,100,56+vx*.5,72+vy,180,360,24).slice(1),[144,138],[148,152],[152+vx*.2,166],[155+vx*.2,178],[140,180],[124,172],[100,174],[76,172],[60,180],[45-vx*.2,178],[48-vx*.2,166],[52,152],[56,138]]
    : [[38-vx-fl,bl-10],[38-vx,100],...ell(100,100,62+vx,72+vy,180,360,24).slice(1),[162+vx+fl,bl-10],[154+vx,bl],[46-vx,bl],[38-vx-fl,bl-10]];
  const lum=hex(hc).reduce((a,v,i)=>a+v*[.3,.59,.11][i],0);
  const rim=lum<70?mix(hc,"#ffffff",.06):line; // only the two darkest colors get a lighter outline
  const bpath=type==="straight"&&li!==4?smooth(bpts.slice(0,-2))+tex(bpts.slice(-3,-1),"spiky",{sp:7,tip:5})+smooth(bpts.slice(-2)):tex(bpts,type,bo);
  const back=`<path d="M${f(bpts[0][0])} ${f(bpts[0][1])} ${bpath} Z" fill="${shade}" stroke="${rim}" stroke-width="2" stroke-linejoin="round"/>`;
  // front
  const ox=li===4?(type==="coily"?37:41):type==="straight"&&li>0?38:(type==="coily"?33:37); let fpts=FR[fringe];
  if(ly<118)fpts=[[151,ly],...fpts.slice(1,-1),[49,ly]];
  const ft=type!=="straight"?type:((fringe==="choppy"||fringe==="crop"||fringe==="emo")?"sharp":"straight");
  const fo=type==="spiky"?{sp:13,tip:9}:type==="wavy"?{amp:3,lam:26}:type==="coily"?{sp:12}:{};
  const tc=(type==="curly"||type==="coily"||type==="spiky");
  const so=type==="spiky"?{sp:14,tip:8}:{};
  const segs=[
    {p:[[ox-1,ly],[ox,100]],t:type,o:so,k:1},
    {p:ell(100,100,100-ox,71,180,360,24),t:tc?type:"straight",o:type==="spiky"?{sp:16,tip:9}:{sp:14},k:tc?1:0},
    {p:[[200-ox,100],[201-ox,ly]],t:type,o:so,k:1},
    {p:[[201-ox,ly],[151,ly]],t:type,o:so,k:1},
    {p:[[151,ly],fpts[0]],t:type,o:so,k:1},
    {p:fpts,t:ft,o:fo,k:1},
    {p:[fpts[fpts.length-1],[49,ly]],t:type,o:so,k:1},
    {p:[[49,ly],[ox-1,ly]],t:type,o:so,k:1}];
  if(type==="straight"&&li>0&&li<4){ // natural straight locks: soft curve along the face, piecey ends
    const tip={sp:7,tip:5};
    segs[0]={p:[[ox,ly],[ox,(ly+100)/2],[ox,100]],t:"straight",k:0};
    segs[2]={p:[[200-ox,100],[200-ox,(ly+100)/2],[200-ox,ly]],t:"straight",k:0};
    segs[3]={p:[[201-ox,ly],[151,ly]],t:"spiky",o:tip,k:1};
    segs[6]={p:[fpts[fpts.length-1],[51,134],[52,ly]],t:"straight",k:1};
    segs[4]={p:[[148,ly],[149,134],fpts[0]],t:"straight",k:1};
    segs[3]={p:[[201-ox,ly],[148,ly]],t:"spiky",o:tip,k:1};
    segs[7]={p:[[52,ly],[ox-1,ly]],t:"spiky",o:tip,k:1};
  }
  if(li===0){ // short: sideburns taper to a soft point instead of a flat edge
    segs[2]={p:[[200-ox,100],[160,112],[155,123]],t:type==="straight"?"straight":type,o:so,k:1};
    segs[3]={p:[[155,123],[151,ly]],t:"straight",k:1};
    segs[6]={p:[fpts[fpts.length-1],[45,123]],t:"straight",k:1};
    segs[7]={p:[[45,123],[40,112],[ox-1,ly]],t:type==="straight"?"straight":type,o:so,k:1};
  }
  if(li===4){ // mullet: sideburns taper to a point above the ears
    segs[2]={p:[[200-ox,100],[155,114]],t:type,o:so,k:1};
    segs[3]={p:[[155,114],[151,ly]],t:type,o:so,k:1};
    segs[6]={p:[fpts[fpts.length-1],[45,114]],t:type,o:so,k:1};
    segs[7]={p:[[45,114],[ox-1,ly]],t:type,o:so,k:1};
  }
  let fill=`M${ox-1} ${ly} `,stroke="",pen=false;
  let inner="";
  segs.forEach((sg,i)=>{const c=tex(sg.p,sg.t,sg.o);fill+=c;
    if(i===1&&sg.k&&type!=="spiky"){inner=`M${f(sg.p[0][0])} ${f(sg.p[0][1])} `+c;pen=false;return;}
    if(sg.k){stroke+=(pen?"":`M${f(sg.p[0][0])} ${f(sg.p[0][1])} `)+c;pen=true;}else pen=false;});
  const extra0=inner&&`<path d="${inner}" stroke="${line}" stroke-width="1.6" fill="none" opacity=".45" stroke-linecap="round"/>`;
  let extra=extra0||"";
  if(type==="straight"&&li>0&&li<4)extra+=`<path d="M38 ${ly-3} L38 100 ${smooth(ell(100,100,62,72,180,360,24))} L162 ${ly-3}" stroke="${rim}" stroke-width="2" fill="none" stroke-linejoin="round"/>`; // one continuous outer outline, same as the back layer
  if((fringe==="side"||fringe==="emo")&&(type==="straight"||type==="wavy")){const pp=Array.from({length:8},(_,k)=>qpt(k/7,[127,40],[126,50],[123,62]));extra+=`<path d="M127 40 ${type==="wavy"?tex(pp,"wavy",{amp:2,lam:14}):smooth(pp)}" stroke="${line}" stroke-width="2" fill="none" stroke-linecap="round"/>`;}
  if(fringe==="curtains"&&(type==="straight"||type==="wavy"))extra+=`<path d="M100 31 L100 62" stroke="${line}" stroke-width="2" stroke-linecap="round"/>`;
  if(type==="straight"||type==="wavy"){ // strands
    // strands flow parallel to the fringe edge (offset copies of it), so they don't radiate from one point
    const inside=([x,y])=>((x-100)/(100-ox-4))**2+((y-100)/66)**2<1&&y<114;
    const drawStrandLater=[];
    const drawStrand=pts=>{if(pts.length<4)return;extra+=`<path d="M${f(pts[0][0])} ${f(pts[0][1])} ${type==="wavy"?tex(pts,"wavy",{amp:2,lam:18}):smooth(pts)}" stroke="${line}" stroke-width="1.3" fill="none" opacity=".42" stroke-linecap="round"/>`;};
    const flowing=["side","emo","curtains"].includes(fringe);
    if(fringe==="none"){ // combed back: strands run from the hairline back over the head
      const fp=resample(fpts,6);[.22,.36,.5,.64,.78].forEach(t=>{const q=fp[Math.round(t*(fp.length-1))],a=[q[0],q[1]-5],e=[100+(q[0]-100)*.55,38],c=[(a[0]+e[0])/2+(q[0]-100)*.12,(a[1]+e[1])/2];
        drawStrandLater.push(Array.from({length:10},(_,k)=>qpt(k/9,a,c,e)));});
    }
    drawStrandLater.forEach(drawStrand);
    if(flowing){
      let r=resample(fpts,4);
      for(let k=0;k<3;k++)r=r.map((q,i)=>{const a=r[Math.max(i-2,0)],b=r[Math.min(i+2,r.length-1)];return [(a[0]+q[0]+b[0])/3,(a[1]+q[1]+b[1])/3];});
      const parts=fringe==="curtains"?[[[.08,.42],[.58,.92]]]:[[[.12,.88]]];
      (fringe==="side"||fringe==="emo"?[[12,.15],[24,.35]]:[[10,.1],[19,.2],[28,.3]]).forEach(([d,cut])=>{
        const off=r.map((q,i)=>{const n=nrm(r[Math.max(i-1,0)],r[Math.min(i+1,r.length-1)]);return [q[0]-n[0]*d,q[1]-n[1]*d];});
        if(fringe==="side"||fringe==="emo"){ // fall away from the side part on both sides
          const L=off.filter(q=>q[0]<119-d*.3),R=off.filter(q=>q[0]>131+d*.3);
          drawStrand(L.slice(0,Math.round(L.length*(1-cut))).filter(inside));
          if(d<15)drawStrand(R.slice(Math.round(R.length*.35)).filter(inside));
        } else (fringe==="curtains"?[[.06+cut*.5,.44],[.56,.94-cut*.5]]:[[cut,1-cut*.8]]).forEach(([a,b])=>{
          drawStrand(off.slice(Math.round(a*off.length),Math.round(b*off.length)).filter(inside));});
      });
    } else if(fringe!=="none"){
      const fp=resample(fpts,14);
      fp.slice(1,-1).forEach((q,i)=>{if(i%2)return;const top=[q[0]+(q[0]<100?3:-3),q[1]-26],sp=Array.from({length:8},(_,k)=>qpt(k/7,top,[q[0],q[1]-14],[q[0],q[1]-6]));drawStrand(sp.filter(inside).length>3?sp:[]);});
    }
    if(ly>140&&li!==4)[[ox+5,ox+7],[195-ox,193-ox]].forEach(([x0,x1])=>{const sp=Array.from({length:10},(_,k)=>qpt(k/9,[x0,112],[(x0+x1)/2+(x0<100?-2:2),(112+ly)/2],[x1,ly-8]));
      extra+=`<path d="M${f(x0)} 112 ${type==="wavy"?tex(sp,"wavy",{amp:2,lam:16}):smooth(sp)}" stroke="${line}" stroke-width="1.3" fill="none" opacity=".45" stroke-linecap="round"/>`;});
  }
  if(type==="curly"||type==="coily"){ // small curl marks inside the hair mass
    [[50,58,205],[50,58,228],[50,58,252],[50,58,276],[50,58,300],[50,58,324],[36,44,232],[36,44,262],[36,44,292],[36,44,318]].forEach(([rx,ry,a],i)=>{
      const x=100+rx*Math.cos(a*Math.PI/180),y=96+ry*Math.sin(a*Math.PI/180);
      extra+=`<path d="M${f(x-4)} ${f(y+1)} a4.5 4.5 0 1 1 ${f(7)} ${f(3)}" stroke="${line}" stroke-width="1.6" fill="none" opacity=".7" stroke-linecap="round"/>`;});
  }
  const front=`<path d="${fill} Z" fill="${hc}"/><path d="${stroke}" stroke="${line}" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>${extra}`;
  return {back,front};
}

function rosettes(hc,list){
  const ring=mix(hc,"#000000",.62),core=mix(hc,"#000000",.18),ring2=mix(hc,"#3A1A00",.5);
  return list.map(([x,y,r,rot],i)=>{
    if(r<3) return `<ellipse cx="${x}" cy="${y}" rx="${r*1.2}" ry="${r*.8}" fill="${i%2?ring:ring2}" transform="rotate(${rot} ${x} ${y})"/>`;
    const segs=[[0,95],[125,210],[240,330]].map(([a0,a1],k)=>{const p=(a)=>[x+r*Math.cos(a*Math.PI/180),y+r*.78*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0+k*7),[x1,y1]=p(a1-k*5);
      return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${(r*.78).toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${k===1?ring2:ring}" stroke-width="${(r*.42+k*.3).toFixed(1)}" fill="none" stroke-linecap="round"/>`;}).join("");

    return `${c.id==="hair"&&i===TYPES.length?`<div class="sep"><span>Special cuts</span></div>`:""}<button class="th ${sel?"on":""} ${statusRaw(key)&&statusRaw(key).u?"lockd":""} ${dim?"dim":""}" data-i="${i}"><svg viewBox="${c.vb}" preserveAspectRatio="xMidYMid meet">${character({...st,...it.set,...(it.set.special===7&&!LEOCOLS.includes(st.hair)?{hair:7}:it.set.special===12&&!WILDCOLS.includes(st.hair)?{hair:13}:it.set.special===15&&!ROCKCOLS.includes(st.hair)?{hair:14}:{}),noShadow:1},false)}</svg><span class="tl">${it.name}</span>${badge(key)}</button>`;}).join("");
  let dots="";
  if(c.dots&&c.dots.k==="hair"&&(st.special===8||st.special===10)){dots="";}
  else if(c.dots){const d=c.dots;dots=d.arr.map((a,i)=>{if(d.allow&&!d.allow(i,v))return "";const key=d.k+":"+i,col=(d.c?d.c(a):a[0])||ORIG,nm=d.n?d.n(a):a[1];
    return `<button class="dt ${v[d.k]===i?"on":""}" data-dk="${d.k}" data-dv="${i}" title="${nm}" style="background:${col}">${statusRaw(key)?`<i>${statusRaw(key).p?statusRaw(key).p:I('lock',10)}</i>`:""}</button>`;}).join("");}
  let bar=tryBar();
  let pre="";
  if(c.id==="tattoo") pre=`<div class="dots prow pre">${TPLACES.map(([k,n])=>{const cnt=tatList((st.tat||{})[k]).length;return `<button class="seg2 ${ui.tplace===k?"on":""}" data-tplace="${k}">${n}${cnt?` · ${cnt}`:""}</button>`;}).join("")}</div>`;
  if(c.id==="pierce") pre=`<div class="dots prow pre">${[["L","Left side"],["R","Right side"]].map(([k,n])=>`<button class="seg2 ${ui.pside===k?"on":""}" data-pside="${k}">${n}</button>`).join("")}<span class="small muted" style="white-space:nowrap">Septum, lip stud and snakebites sit in the middle</span></div>`;
  if(!bar&&c.id==="pierce") bar=`<div class="dots prow">${PCOL.map((p,i)=>`<button class="dt ${st.pcol===i?"on":""}" data-pcol="${i}" title="${p[2]}" style="background:${p[0]}"></button>`).join("")}<span class="small muted">Metal colour</span></div>`;
  if(!bar&&c.id==="tattoo"){const l=tatList((st.tat||{})[ui.tplace]);bar=`<div class="dots empty">${l.length?`<b style="color:var(--ink)">${PLACEN[ui.tplace]}:</b>&nbsp;${l.map(n=>TATTOOS[n]).join(" + ")}`:"Tap a design to add it, tap again to remove. Designs can go over each other."}</div>`;}
  if(!bar&&st.special>0&&(c.id==="len"||c.id==="fringe"))bar=`<div class="buy info"><div>${I('hair',18)}<div><b>${SPECIAL[st.special]} has its own ${c.id==="len"?"length":"fringe"}</b><span>Pick one to go back to your ${TYPES[st.type]} hair</span></div></div></div>`;
  return `<div class="cats" id="cats">${cats}</div>
    ${pre}<div class="thumbs" id="thumbs">${thumbs}</div>
    ${bar?bar:(dots?`<div class="dots">${dots}</div>`:`<div class="dots empty">${(st.special===8||st.special===10)&&c.dots&&c.dots.k==="hair"?(st.special===8?"Bouffant comes in platinum blonde only":"Tangled comes in black only"):c.id==="outfit"?"Colour combos to start from. Your own saved outfits go here later.":"No colours for this one"}</div>`)}`;
}
function movesPanel(){
  const shown=MOVEORDER.filter(n=>["all",KIND(),"rare"].includes(MOVES[n].cat));let lastCat="";
  const cards=shown.map(n=>{const cat=MOVES[n].cat,sep=cat!==lastCat&&lastCat?`<div class="sep"><span>${cat==="rare"?"Rare":cat==="guitar"?"Guitar":"Drums"}</span></div>`:"";lastCat=cat;const key="move:"+n,s=statusRaw(key);
    return `${sep}<button class="th mv ${n===ui.move?"on":""} ${s&&s.u?"lockd":""}" data-move="${n}"><svg viewBox="10 20 180 312">${characterMove({...st,noShadow:1},n,true)}</svg><span class="tl">${n}</span>${n===ui.fav?`<span class="bdg fav">${I('star',11)}</span>`:badge(key)}</button>`;}).join("");
  const key="move:"+ui.move,s=status(key);
  let bar;
  if(s&&s.u)bar=`<div class="buy"><div>${I('lock',18)}<div><b>${ui.move}</b><span>${lockText(s)}</span></div></div></div>`;
  else if(s){const short=s.p-tips;bar=`<div class="buy"><div>${I('tip',18)}<div><b>${ui.move}</b><span>${short>0?`You need ${short} more Tips`:`${s.p} Tips`}</span></div></div><button class="cta" data-act="buymove" ${short>0?"disabled":""}>Buy</button></div>`;}
  else if(ui.move===ui.fav)bar=`<div class="buy ok"><div>${I('star',18)}<div><b>Your Stage move</b><span>Plays when someone taps you on Stage</span></div></div></div>`;
  else bar=`<div class="buy"><div>${I('check',18)}<div><b>${ui.move}</b><span>Owned</span></div></div><button class="cta" data-act="fav">Use on Stage</button></div>`;
  return `<div class="sub">Signature moves</div><div class="thumbs tall" id="thumbs">${cards}</div>${bar}`;
}
function gearPanel(){
  const g=GEARL().map(([n],i)=>{const key="gear:"+i,s=statusRaw(key);
    return `<button class="th gear ${i===ui.gear?"on":""} ${s&&s.u?"lockd":""}" data-gear="${i}"><div class="gph">${I('gear',30)}</div><span class="tl">${n}</span>${badge(key)}</button>`;}).join("");
  return `<div class="sub">${KIND()==="guitar"?"Guitar":"Drums"} gear</div><div class="thumbs" id="thumbs">${g}</div><div class="buy"><div>${I('gear',18)}<div><b>${KIND()==="guitar"?"Starter guitar":"Starter kit"}</b><span>${KIND()==="guitar"?"A beat-up S-style. Upgrades come one by one.":"Beat-up kick, snare and hi-hat. Upgrades come one by one."}</span></div></div></div>`;
}
function postersPanel(){
  const got=FESTS.map((f,i)=>[f,i]).filter(([f])=>f.got||TEST_MODE);
  return `<div class="scroll"><p class="muted small" style="margin:2px 2px 12px">Posters from the big festivals and flyers from local gigs, with you as the headliner. Tap one to see it big.</p>
  <div class="pgrid">${got.map(([f,i])=>`<button class="poster" data-poster="${i}">${posterSVG(f,i,st,false)}</button>`).join("")}</div>
  <div class="nextfest">${I('star',16)}<div><b>Next festival in 9 weeks</b><span>Its poster stays a secret until you play there.</span></div></div></div>
  ${ui.poster!=null?`<div class="pmodal" data-act="closeposter"><div class="pbig">${posterSVG(FESTS[ui.poster],ui.poster+10,st,false)}</div><div class="small muted" style="margin-top:10px">Tap anywhere to close</div></div>`:""}`;
}
function titlesPanel(){
  const got=TITLES.filter(t=>t.got),lock=TITLES.filter(t=>!t.got);
  return `<div class="scroll">
   <div class="card row" style="gap:12px"><div class="ava"><svg viewBox="18 14 164 164">${character({...st,noShadow:1},false)}</svg></div><div><div style="font-weight:900;font-size:19px">Stix Nova</div><div class="ft" style="color:${MEDAL[TITLES.find(t=>t.n===ui.title).tier][1]}">${I('star',12)} ${ui.title}</div></div></div>
   <p class="muted small" style="margin:10px 2px 6px">Your featured title is shown under your stage name. Tap one to feature it.</p>
   ${got.map(t=>`<button class="trow ${t.n===ui.title?"on":""}" data-title="${t.n}"><span class="medal" style="color:${MEDAL[t.tier][1]}">${I('star',20)}</span><div><b>${t.n} <i class="mt" style="color:${MEDAL[t.tier][1]}">${MEDAL[t.tier][0]}</i></b><span>Next ${t.next}</span><i class="pb"><i style="width:${t.prog*100}%"></i></i></div>${t.n===ui.title?I('check',18):""}</button>`).join("")}
   <div class="sub" style="margin-top:14px">Still to earn</div>
   ${lock.map(t=>`<div class="trow lockd"><span class="lv">${I('lock',12)}</span><div><b>${t.n}</b><span>${t.req}</span><i class="pb"><i style="width:${t.prog*100}%"></i></i></div></div>`).join("")}
  </div>`;
}
function render(){
  const T=ui.tab,showHero=["Look","Moves","Gear"].includes(T);
  const panel={Look:lookPanel,Moves:movesPanel,Gear:gearPanel,Posters:postersPanel,Titles:titlesPanel}[T]();
  const sc=document.getElementById('cats')?.scrollLeft||0,sth=document.getElementById('thumbs')?.scrollLeft||0;
  document.getElementById('bsScreen').innerHTML=`
   <div class="top"><button class="back" data-act="back">${I('back',20)}</button><div style="flex:1"><div class="crumb">Stage</div><h1>Backstage</h1></div><div class="tips">${I('tip',16)}${tips}</div></div>
   <div class="seg">${TABS.map(t=>`<button class="${t===T?"on":""}" data-tab="${t}">${t}</button>`).join("")}</div>
   ${showHero?hero():""}${ui.cart?cartPanel():""}
   <div class="panel ${showHero?"":"full"}">${panel}</div>
`;
  const c=document.getElementById('cats');if(c){c.scrollLeft=sc;}const th=document.getElementById('thumbs');if(th&&!ui.resetThumbs)th.scrollLeft=sth;ui.resetThumbs=false;
  bind();persist();
}
const R=n=>Math.floor(Math.random()*n);
function bind(){
  const S=document.getElementById('bsScreen');
  S.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;ui.try=null;ui.poster=null;if(ui.tab!=="Look")ui.zoom=false;else ui.zoom=!!CATS.find(x=>x.id===ui.cat).zoom;render();});
  S.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ui.cat=b.dataset.cat;ui.try=null;ui.zoom=!!CATS.find(x=>x.id===ui.cat).zoom;ui.zoomBody=CATS.find(x=>x.id===ui.cat).zoom==="body";ui.resetThumbs=true;render();});
  S.querySelectorAll('.th[data-i]').forEach(b=>b.onclick=()=>{const c=CATS.find(x=>x.id===ui.cat),it=c.items[+b.dataset.i];
    if(c.tat){const place=ui.tplace,list=tatList((st.tat||{})[place]),has=list.includes(it.tat),nl=has?list.filter(x=>x!==it.tat):[...list,it.tat],nt={...(st.tat||{}),[place]:nl},base=SHOP[`tattoo:${it.tat}`],pk=`tattoo:${it.tat}:${place}`;
      if(!has&&!TEST_MODE&&base&&!owned.has(pk)){ui.try={set:{tat:nt},key:pk,keys:[pk],price:base.p||0,u:base.u&&!reached(base.u)?base.u:null,name:it.name+' tattoo'};}else{st.tat=nt;ui.try=null;}render();return;}
    if(it.pid){const id=it.pid,cur=pSides(id,(st.pierce||{})[id]),side=it.sided?ui.pside:"C";
      let nv;if(id==="snake")nv=cur.length?0:1;else if(!it.sided)nv=cur.length?0:1;else{const ns=cur.includes(side)?cur.filter(s=>s!==side):[...cur,side];nv=pVal(id,ns);}
      const np=setPierce(st.pierce||{},id,nv),addSides=pSides(id,nv).filter(s=>!cur.includes(s)),base=SHOP[`pierce:${id}`],need=addSides.map(s=>`pierce:${id}:${s}`).filter(k=>!owned.has(k));
      if(!TEST_MODE&&base&&need.length){ui.try={set:{pierce:np},key:`pierce:${id}`,keys:need,price:(base.p||0)*need.length,u:base.u&&!reached(base.u)?base.u:null,name:it.name};}else{st.pierce=np;ui.try=null;}render();return;}
    const key=keyOf(it.set);
    const set=it.set.special===7&&!LEOCOLS.includes(st.hair)?{...it.set,hair:7}:it.set.special===12&&!WILDCOLS.includes(st.hair)?{...it.set,hair:13}:it.set.special===15&&!ROCKCOLS.includes(st.hair)?{...it.set,hair:14}:it.set;
    if(status(key)){ui.try={set,key,name:it.name};}else{Object.assign(st,set);ui.try=null;}render();});
  S.querySelectorAll('[data-dk]').forEach(b=>b.onclick=()=>{const k=b.dataset.dk,v=+b.dataset.dv,key=k+":"+v,c=CATS.find(x=>x.id===ui.cat),d=c.dots;
    const nm=(d.n?d.n(d.arr[v]):d.arr[v][1])+" "+c.label.toLowerCase();
    const also=d.also||{};if(status(key)){ui.try={set:{[k]:v,...also},key,name:nm};}else if(also.jacket&&status('jacket:'+also.jacket)){ui.try={set:{[k]:v,...also},key:'jacket:'+also.jacket,name:JACKETS[also.jacket]};}else{st[k]=v;Object.assign(st,also);ui.try=null;}render();});
  S.querySelectorAll('[data-pside]').forEach(b=>b.onclick=()=>{ui.pside=b.dataset.pside;render();});
  S.querySelectorAll('[data-tplace]').forEach(b=>b.onclick=()=>{ui.tplace=b.dataset.tplace;render();});
  S.querySelectorAll('[data-pcol]').forEach(b=>b.onclick=()=>{st.pcol=+b.dataset.pcol;render();});
  S.querySelectorAll('[data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=cartItems()[+b.dataset.rm];if(!i)return;const r=i.rm;
    if(ui.try)ui.try=null;
    if(r.k){st[r.k]=r.v;if(r.k==="jcol")st.jacket=0;}
    if(r.tat)st.tat={...st.tat,[r.tat]:tatList(st.tat[r.tat]).filter(x=>x!==r.n)};
    if(r.pid){const left=pSides(r.pid,st.pierce[r.pid]).filter(s=>s!==r.side);st.pierce={...st.pierce,[r.pid]:pVal(r.pid,left)};}
    render();});
  S.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{ui.move=b.dataset.move;render();});
  S.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>{ui.gear=+b.dataset.gear;render();});
  S.querySelectorAll('[data-poster]').forEach(b=>b.onclick=()=>{ui.poster=+b.dataset.poster;render();});
  S.querySelectorAll('[data-title]').forEach(b=>b.onclick=()=>{ui.title=b.dataset.title;render();});
  S.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=b.dataset.act;
    if(a==="back"){showStage();return;}
    if(a==="zoom")ui.zoom=!ui.zoom;
    if(a==="cart")ui.cart=true;
    if(a==="closecart")ui.cart=false;
    if(a==="buyall"){const it=cartItems().filter(i=>!i.locked);it.forEach(i=>{tips-=i.p;owned.add(i.key);});if(ui.try){Object.assign(st,ui.try.set);ui.try=null;}ui.cart=false;}
    if(a==="closeposter")ui.poster=null;
    if(a==="cancel")ui.try=null;
    if(a==="buy"){const T=ui.try;tips-=T.price!=null?T.price:SHOP[T.key].p;(T.keys||[T.key]).forEach(k=>owned.add(k));Object.assign(st,T.set);ui.try=null;}
    if(a==="buymove"){tips-=SHOP["move:"+ui.move].p;owned.add("move:"+ui.move);}
    if(a==="fav")ui.fav=ui.move;
    if(a==="rnd"){const pick=(k,n)=>{let v;do{v=R(n);}while(status(k+":"+v));st[k]=v;};
      pick("skin",6);pick("type",5);pick("len",5);pick("fringe",6);st.special=0;st.makeup=0;st.tattoo=0;st.pierce={};pick("hair",HAIR.length);pick("eyes",6);pick("shirt",SHIRTS.length);pick("pants",PANTS.length);pick("shoes",SHOES.length);
      pick("top",4);st.jacket=R(3)?0:1;pick("bottom",5);pick("shoe",3);st.facial=0;if(!R(3))pick("facial",10);st.glasses=0;if(!R(3))pick("glasses",8);st.hat=0;if(!R(3))pick("hat",8);ui.try=null;}
    render();});
  const h=document.getElementById('hero');if(h&&ui.tab==="Look")h.onclick=()=>{ui.zoom=!ui.zoom;render();};
  if(h&&ui.tab==="Moves")h.onclick=()=>render();
}

window.renderBackstage=render;
window.persist=function(){G.look=JSON.parse(JSON.stringify(st));G.tips=tips;G.owned=[...owned];G.fav=ui.fav;G.title=ui.title;save();};
})();
window.renderStage();
</script>
