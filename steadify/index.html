<!DOCTYPE html>
<html lang="en">
<head>

<title>steadify · your pocket coach</title>

<style>
/* dark is the default theme; light via <html data-theme="light"> */
/* dark is the default theme; light via <html data-theme="light">. Brand gradient = logo (amber -> pink) */
:root{
  color-scheme:dark; --g1:#FFB347; --g2:#FF4F8B;
  --bg:#0F0E11; --surface:#18161B; --surface2:#232027; --ink:#F3EEF1; --muted:#A39AA3; --line:#2C2830;
  --grad:linear-gradient(135deg,#FFB347 0%,#FF4F8B 100%);
  --primary:#FF7A72; --primary-ink:#1C0F14; --primary-soft:#33191F;
  --flame:#FFB347; --flame-soft:#35271A; --pink:#FF4F8B; --ice:#6BB8F0; --ice-soft:#18293A;
  --warn:#FF6B6B; --radius:18px; --shadow:0 1px 2px rgba(0,0,0,.35);
  --nav-h:64px;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F7F3F1; --surface:#FFFFFF; --surface2:#F0EAE8; --ink:#1E1519; --muted:#776A70; --line:#E7DEDB;
  --primary:#E5484D; --primary-soft:#FDE6E4;
  --flame:#E8901F; --flame-soft:#FCEBD5; --pink:#E33B78; --ice:#3E9BDB; --ice-soft:#DEEEFA;
  --warn:#D64545; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark{width:28px;height:28px;flex:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
body.no-nav{padding-bottom:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--primary)}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px}
h1{font-size:28px;margin:4px 0 2px;font-weight:900;letter-spacing:-.02em}
h2{font-size:19px;margin:22px 0 10px;font-weight:800}
h3{font-size:16px;margin:0;font-weight:800}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrapf{flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;min-height:40px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.03em}
.brand{display:flex;align-items:center;gap:8px} .brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--surface2)}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card+.card{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:800;background:var(--surface2);color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:var(--primary-ink);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:0 14px;border-radius:11px;font-size:14px}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:11px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.level{border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;background:var(--surface)}
.level b{display:block;font-size:15px}
.level .min{font-size:22px;font-weight:900}
.level.on{border-color:var(--primary);background:var(--primary-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.tag{padding:2px 8px;font-size:12px;border-width:1px;background:var(--surface2);border-color:transparent}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.streak{display:flex;gap:14px;align-items:center}
.flame{width:58px;height:58px;border-radius:18px;background:var(--grad);color:var(--primary-ink);display:grid;place-items:center}
.flame.off{background:var(--surface2);color:var(--muted)}
.flame .icon{width:32px;height:32px;fill:currentColor;stroke:none}
.bignum{font-size:30px;font-weight:900;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.dot{width:30px;height:30px;margin:4px auto 0;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.dot.done{background:var(--grad);color:var(--primary-ink)}
.dot.frozen{background:var(--ice);color:#fff}
.dot.today{outline:2px solid var(--ink);outline-offset:2px}
.dot .icon{width:16px;height:16px}
.freeze{display:inline-flex;align-items:center;gap:4px;color:var(--ice);font-weight:800;font-size:14px}
.freeze .icon{width:16px;height:16px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:900;font-size:15px;line-height:1.05}
.ring .lbl small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.ex{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border-radius:16px;border:1px solid var(--line);width:100%;text-align:left}
.ex+.ex{margin-top:8px}
.thumb{width:56px;height:56px;border-radius:12px;background:var(--surface2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:6px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.pill.pad{background:var(--primary-soft);color:var(--primary)}
.pill.kit{background:var(--flame-soft);color:var(--flame)}
.pill.warm{background:var(--ice-soft);color:var(--ice)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px}
.input{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;font-size:16px}
.input:focus{outline:none;border-color:var(--primary)}
textarea.input{min-height:80px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav .in{display:flex;max-width:560px;width:100%}
.nav a{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:800}
.nav a.on{color:var(--primary)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--grad);color:var(--primary-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:15}
.fab .icon{width:28px;height:28px}
.plan-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.plan-item+.plan-item{margin-top:8px}
.plan-item .kind{width:8px;align-self:stretch;border-radius:4px;background:var(--grad)}
.plan-item .kind.warmup{background:var(--ice)} .plan-item .kind.free{background:var(--flame)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:10px;background:var(--surface2);font-weight:900;font-size:18px}
.stepper b{min-width:44px;text-align:center}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:-6px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* player */
.player{min-height:100vh;display:flex;flex-direction:column}
.player .wrap{flex:1;display:flex;flex-direction:column;width:100%}
.prog{display:flex;gap:4px;margin:6px 0 14px}
.prog i{flex:1;height:6px;border-radius:6px;background:var(--surface2)}
.prog i.done{background:var(--grad)} .prog i.cur{background:var(--flame)}
.timer{font-size:64px;font-weight:900;text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.timer.over{color:var(--flame)}
.media{margin:12px 0;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.media img{display:block;width:100%;height:auto}
.sticking{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:800;letter-spacing:.12em;text-align:center;padding:10px;background:var(--surface);border-radius:12px;border:1px solid var(--line);margin:10px 0;word-break:break-word}
.metro{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.beats{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}
.beats i{width:14px;height:14px;border-radius:50%;background:var(--surface2);transition:background .05s}
.beats i.hit{background:var(--flame)} .beats i.hit.acc{background:var(--pink)}
.bpm{font-size:40px;font-weight:900;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:10px;margin-top:auto;padding-top:16px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{border:2px solid var(--line);border-radius:12px;padding:10px 0;font-weight:900;font-size:18px;background:var(--surface)}
.rate button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.celebrate{text-align:center;padding:24px 0}
.celebrate .flame{width:96px;height:96px;margin:0 auto 12px;border-radius:30px;animation:pop .5s ease-out}
.celebrate .flame .icon{width:54px;height:54px}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .v{font-size:26px;font-weight:900}
.stat .k{font-size:12px;color:var(--muted);font-weight:700}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface2)}
.hbar{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.hbar .t{width:96px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{flex:1;height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--grad)}
.hbar .n{width:48px;text-align:right;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:80;animation:fade .2s;max-width:90vw}
.crop{position:relative;touch-action:none;user-select:none;border-radius:12px;overflow:hidden;background:#000}
.crop canvas{display:block;width:100%;height:auto}
.crop .sel{position:absolute;border:2px solid var(--flame);background:rgba(255,122,114,.15);pointer-events:none}
.hint{font-size:13px;color:var(--muted);margin:6px 0 10px}
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.logo-big{font-size:44px;font-weight:900;letter-spacing:-.04em;text-align:center}
.logo-big span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent} .logo-big .mark{width:72px;height:72px;display:block;margin:0 auto 10px}
.list-sep{height:1px;background:var(--line);margin:12px 0}
.video{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin:10px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.picto{width:100%;height:100%;display:block}
.inst-thumb{color:var(--ink);padding:10px}
.inst-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 8px;border-radius:12px;background:var(--surface2);font-weight:800;font-size:14px}
.inst-chip .pi{width:22px;height:22px;color:var(--ink)}
.inst-chip .icon{width:16px;height:16px;color:var(--muted)}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kind-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:13px;color:var(--ink)}
.kind-tile svg{width:44px;height:44px}
.kind-tile.on{border-color:var(--primary);background:var(--primary-soft)}
.kind-tile.on svg{color:var(--primary)}
.kind-tile .kpi{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);padding:8px}
.kind-tile .kpi svg{width:36px;height:36px}
.kind-tile.on{border-color:var(--kc);background:var(--surface)}
.kind-tile.on .kpi{background:var(--kg);color:#1C0F14}
.kind-tile.on svg{color:#1C0F14}
.inst-chip .pi{color:var(--primary)}
.pages{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pages::-webkit-scrollbar{display:none}
.pages .media{flex:0 0 100%;margin:0;scroll-snap-align:center;position:relative}
.pg{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.media{position:relative}
.stk-mini{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--primary);margin:2px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{display:inline-grid;place-items:center;width:30px;height:30px;margin:-4px -6px -4px 2px;color:var(--muted);flex:none;border-radius:10px}
.star .icon{width:19px;height:19px}
.star.on{color:#FFC94A}
.star.on .icon{fill:#FFC94A}
.iconbtn.star{width:40px;height:40px;margin:0}
.meter{display:inline-flex;gap:3px;align-items:center}
.meter i{width:12px;height:6px;border-radius:3px;background:var(--surface2)}
.meter i.on{background:var(--grad)}

</style>
</head>

<script>
'use strict';
/* ================= utils ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = keyToDate(k); d.setDate(d.getDate() + n); return dayKey(d); };
const diffDays = (a, b) => Math.round((keyToDate(b) - keyToDate(a)) / 864e5);
const fmtTime = sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${pad2(sec % 60)}`; };
const fmtMin = sec => { const m = Math.round(sec / 60); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const parseMMSS = s => { if (!s) return 0; s = String(s).trim(); if (s.includes(':')) { const [m, x] = s.split(':'); return (+m || 0) * 60 + (+x || 0); } return +s || 0; };
const toMMSS = sec => sec ? `${Math.floor(sec / 60)}:${pad2(sec % 60)}` : '';
const weekdayShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/* ================= icons ================= */
const ICONS = {
  flame: '<path d="M12 2c1 3.5 5 5.6 5 10.5A5 5 0 0 1 12 18a5 5 0 0 1-5-5.2c0-2 1-3.4 2.2-4.4.2 1.6 1 2.6 2 3C11 8.5 11 5 12 2z"/><path d="M12 22a7 7 0 0 1-7-7c0-1 .2-2 .6-2.8A6.5 6.5 0 0 0 12 19a6.5 6.5 0 0 0 6.4-6.8c.4.9.6 1.8.6 2.8a7 7 0 0 1-7 7z"/>',
  snow: '<path d="M12 2v20M4.9 6l14.2 12M19.1 6 4.9 18M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  play: '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
  pause: '<path d="M8 5v14M16 5v14"/>',
  next: '<path d="M6 5l9 7-9 7zM18 5v14"/>',

/* ================= storage (IndexedDB w/ memory fallback) ================= */
const DB = {
  db: null, mem: { kv: {}, media: {} },
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('steadify', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('media'); };
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
        r.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  _tx(store, mode, fn) {
    return new Promise(res => {
      try {
        const tx = this.db.transaction(store, mode); const os = tx.objectStore(store);
        const req = fn(os); tx.oncomplete = () => res(req && req.result); tx.onerror = () => res(undefined);
      } catch (e) { res(undefined); }
    });
  },
  get(store, key) { return this.db ? this._tx(store, 'readonly', os => os.get(key)) : Promise.resolve(this.mem[store][key]); },
  put(store, key, val) { if (!this.db) { this.mem[store][key] = val; return Promise.resolve(); } return this._tx(store, 'readwrite', os => os.put(val, key)); },
  del(store, key) { if (!this.db) { delete this.mem[store][key]; return Promise.resolve(); } return this._tx(store, 'readwrite', os => os.delete(key)); },
  keys(store) { return this.db ? this._tx(store, 'readonly', os => os.getAllKeys()) : Promise.resolve(Object.keys(this.mem[store])); },
};

/* tempo model: base tempo (exercise.currentBpm) stays put; daily max is logged separately.

function cleanAtBase(e) {

  S.logs.forEach(l => { if (l.date < since) return; (l.entries || []).forEach(x => { if (x.exId === e.id && (x.rating || 0) >= 4 && x.bpm && x.bpm >= base) dates.push(l.date); }); });

/* streak with freezes, derived purely from logs */
function streakInfo() {
  const goalSec = goalMin() * 60;
  const dm = dayMinutes(); const today = dayKey();
  const days = Object.keys(dm).filter(k => dm[k] >= goalSec).sort();
  const status = {}; // day -> 'done' | 'frozen'
  let streak = 0, best = 0, freezes = 0, earnedRun = 0;
  if (days.length) {
    let d = days[0];
    while (d <= today) {
      if (dm[d] >= goalSec) {
        streak++; earnedRun++; status[d] = 'done';
        if (earnedRun % 7 === 0 && freezes < 2) freezes++;
      } else if (d !== today) {
        if (freezes > 0) { freezes--; status[d] = 'frozen'; }
        else { streak = 0; earnedRun = 0; }
      }
      best = Math.max(best, streak);
      d = addDays(d, 1);
    }
  }
  const doneToday = (dm[today] || 0) >= goalSec;
  return { streak, best, freezes, status, doneToday, todaySec: dm[today] || 0, goalSec };
}

/* ================= session planning ================= */
function splitFor(mode, total) {
  const warm = Math.max(2, Math.round(total * (mode === 'pad' ? 0.25 : 0.15)));
  const free = mode === 'kit' ? Math.max(2, Math.round(total * 0.15)) : 0;
  return { warm, free, focus: Math.max(1, total - warm - free) };
}
function distribute(total, n) { const base = Math.floor(total / n); const arr = Array(n).fill(base); let r = total - base * n; for (let i = 0; r > 0; i = (i + 1) % n, r--) arr[i]++; return arr; }

function buildPlan(mode, level, focusTag = null) {
  const total = cur().levels[mode][level];
  const sp = splitFor(mode, total);
  const items = [];
  // warm-up
  const routine = ROUT().find(r => r.id === cur().defaultRoutine) || ROUT()[0];
  let wu = routine ? routine.items.filter(i => exById(i.exId)) : [];
  if (!wu.length) wu = EX().filter(e => e.warmup && fitsMode(e, mode)).slice(0, 3).map(e => ({ exId: e.id, min: 2 }));
  if (wu.length) {
    const sum = wu.reduce((a, i) => a + (i.min || 1), 0);
    let mins = wu.map(i => Math.max(1, Math.round((i.min || 1) * sp.warm / sum)));
    while (mins.reduce((a, b) => a + b, 0) > sp.warm && mins.length > 1) { mins.pop(); wu = wu.slice(0, mins.length); }
    wu.forEach((i, k) => items.push({ kind: 'warmup', exId: i.exId, min: mins[k] }));
  } else items.push({ kind: 'warmup', title: 'Free warm-up', min: sp.warm });
  // focus
  const lp = lastPracticed(); const ts = tagSeconds(14); const today = dayKey();
  let cands = EX().filter(e => !e.warmup && fitsMode(e, mode));
  if (focusTag) { const f = cands.filter(e => (e.tags || []).includes(focusTag)); if (f.length) cands = f; }
  const focusTags = new Set((tagGroups().Focus || []).concat(S.settings.customTags));
  const scored = cands.map(e => {
    const since = lp[e.id] ? diffDays(lp[e.id], today) : 21;
    const neglect = (e.tags || []).filter(t => focusTags.has(t)).reduce((a, t) => a + (ts[t] ? 0 : 4), 0);
    const notDone = e.targetBpm && e.currentBpm && e.currentBpm < e.targetBpm ? 2 : 0; // still climbing
    return { e, s: Math.min(since, 21) * 2 + neglect + notDone + (e.fav ? 5 : 0) + Math.random() * 6 };
  }).sort((a, b) => b.s - a.s);
  const per = mode === 'pad' ? 5 : 8;
  const n = Math.max(1, Math.min(Math.round(sp.focus / per), scored.length));
  if (scored.length) {
    const mins = distribute(sp.focus, n);
    scored.slice(0, n).forEach((x, k) => items.push({ kind: 'focus', exId: x.e.id, min: mins[k] }));
  } else items.push({ kind: 'focus', title: 'Free practice', min: sp.focus });
  if (sp.free) items.push({ kind: 'free', title: 'Free play / songs', min: sp.free });
  return { id: uid(), inst: cur().id, mode, level, focusTag, items, createdAt: Date.now() };
}

function ytId(url) { if (!url) return null; const m = url.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/); return m ? m[1] : null; }
function syncDraft() {
  const d = UI.draft; if (!d || !$('#f_name')) return;
  d.name = $('#f_name').value.trim(); d.warmup = $('#f_warm').checked;
  d.startBpm = +$('#f_sb').value || null; d.targetBpm = +$('#f_tb').value || null; d.step = +$('#f_st').value || null;
  d.sticking = $('#f_stk') ? $('#f_stk').value.trim() : (d.sticking || ''); d.link = $('#f_link').value.trim(); d.notes = $('#f_notes').value; if ($('#f_nf')) d.notefy = $('#f_nf').value.trim();
  const url = $('#f_yt').value.trim(); const id = ytId(url);
  d.youtube = url ? { url, id, start: parseMMSS($('#f_yts').value), end: parseMMSS($('#f_yte').value) } : null;
}
A.setWhere = el => { syncDraft(); UI.draft.where = el.dataset.w; render(); };
A.togTag = el => { syncDraft(); const t = el.dataset.t, a = UI.draft.tags; const i = a.indexOf(t); i >= 0 ? a.splice(i, 1) : a.push(t); const y = scrollY; render(); scrollTo(0, y); };
A.addTag = () => { syncDraft(); const t = $('#f_newtag').value.trim().toLowerCase(); if (!t) return; if (!S.settings.customTags.includes(t) && !Object.values(tagGroups()).flat().includes(t)) S.settings.customTags.push(t); if (!UI.draft.tags.includes(t)) UI.draft.tags.push(t); save(); const y = scrollY; render(); scrollTo(0, y); };
A.openNf = () => { const u = $('#f_nf')?.value.trim(); if (!validNotefy(u)) return toast('Paste a notefy share link first (…/notefy/#g=…)'); const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); };
A.focusYt = () => $('#f_yt').focus();
A.rmMedia = el => { syncDraft(); const imgs = exImages(UI.draft).slice(); imgs.splice(+el.dataset.i, 1); UI.draft.images = imgs; UI.draft.media = null; render(); };
A.pgUp = el => { syncDraft(); const imgs = exImages(UI.draft).slice(), i = +el.dataset.i; [imgs[i - 1], imgs[i]] = [imgs[i], imgs[i - 1]]; UI.draft.images = imgs; UI.draft.media = null; render(); };
A.cancelEdit = () => { const back = UI.editId ? 'exercise' : (UI.draftWarm ? 'warmup' : 'library'); UI.draft = null; go(back); };
A.saveEx = () => {
  syncDraft(); const d = UI.draft;
  if (!d.name) { toast('Give it a name'); $('#f_name').focus(); return; }
  if (d.youtube && !d.youtube.id) { toast("That YouTube link doesn't look right"); return; }
  if (d.notefy && !validNotefy(d.notefy)) { toast('Notefy link must start with radimusi.github.io/notefy/ and contain #g='); $('#f_nf')?.focus(); return; }
  if (!d.currentBpm) { d.currentBpm = d.startBpm || null; d.baseSince = dayKey(); }
  const ix = S.exercises.findIndex(e => e.id === d.id);
  d.inst = d.inst || cur().id;
  if (ix >= 0) S.exercises[ix] = d; else { d.createdAt = Date.now(); S.exercises.push(d); }
  save(); UI.exId = d.id; const wasWarm = UI.draftWarm; UI.draft = null; UI.editId = null; toast('Saved'); go(wasWarm ? 'warmup' : 'exercise');

A.deleteEx = () => confirmSheet('Delete this exercise? Your practice history stays.', 'Delete', () => {
  S.exercises = S.exercises.filter(e => e.id !== UI.editId);
  S.routines.forEach(r => r.items = r.items.filter(i => i.exId !== UI.editId));
  S.plans.forEach(p => p.items = p.items.filter(i => i.exId !== UI.editId));
  save(); UI.draft = null; UI.editId = null; go('library');
});

A.runRoutine = el => { const r = S.routines.find(x => x.id === el.dataset.id); const items = r.items.filter(i => exById(i.exId)).map(i => ({ kind: 'warmup', exId: i.exId, min: i.min })); if (!items.length) return toast('Routine is empty'); Player.begin({ id: uid(), inst: cur().id, mode: 'pad', level: 'warmup', items }); go('session'); };
A.editRoutine = el => {
  const r = el.dataset.id ? JSON.parse(JSON.stringify(S.routines.find(x => x.id === el.dataset.id))) : { id: uid(), inst: cur().id, name: 'My warm-up', items: [] };
  const draw = () => {
    const wex = EX().filter(e => e.warmup);
    const isDef = (cur().defaultRoutine || ROUT()[0]?.id) === r.id;
    openSheet(`<h3>${S.routines.some(x => x.id === r.id) ? 'Edit routine' : 'New routine'}</h3>
      <label class="field" style="margin-top:12px"><span>Name</span><input class="input" id="r_name" value="${esc(r.name)}"></label>
      <div class="small muted" style="font-weight:800;margin-bottom:6px">Exercises · ${r.items.reduce((a, i) => a + i.min, 0)} min</div>
      ${r.items.map((it, i) => `<div class="plan-item"><div class="kind warmup"></div><div class="grow"><h3>${esc(exById(it.exId)?.name || '?')}</h3></div>
        <div class="stepper"><button data-r="min" data-i="${i}" data-d="-1">−</button><b>${it.min}′</b><button data-r="min" data-i="${i}" data-d="1">+</button></div>
        <button class="iconbtn" data-r="up" data-i="${i}" style="width:30px">${icon('up')}</button><button class="iconbtn" data-r="rm" data-i="${i}" style="width:30px">${icon('x')}</button></div>`).join('') || '<div class="hint">Tap exercises below to add them.</div>'}
      <div class="small muted" style="font-weight:800;margin:14px 0 6px">Add</div>
      <div class="chips">${wex.map(e => `<button class="chip" data-r="add" data-id="${e.id}">+ ${esc(e.name)}</button>`).join('')}</div>
      <label class="row" style="margin:16px 0"><input type="checkbox" id="r_def" ${isDef ? 'checked' : ''} style="width:20px;height:20px"> <span>Use as default warm-up in sessions</span></label>
      <div class="row"><button class="btn primary grow" data-r="save">Save</button></div>
      ${S.routines.some(x => x.id === r.id) ? `<button class="btn danger block" style="margin-top:8px" data-r="del">${icon('trash')} Delete routine</button>` : ''}`, bg => {
      bg.addEventListener('click', ev => {
        const b = ev.target.closest('[data-r]'); if (!b) return; r.name = $('#r_name', bg).value; const i = +b.dataset.i;
        const act = b.dataset.r;
        if (act === 'min') r.items[i].min = clamp(r.items[i].min + +b.dataset.d, 1, 30);
        if (act === 'up' && i > 0) [r.items[i - 1], r.items[i]] = [r.items[i], r.items[i - 1]];
        if (act === 'rm') r.items.splice(i, 1);
        if (act === 'add') r.items.push({ exId: b.dataset.id, min: 2 });
        if (act === 'save') {
          if (!r.items.length) return toast('Add at least one exercise');
          const ix = S.routines.findIndex(x => x.id === r.id); if (ix >= 0) S.routines[ix] = r; else S.routines.push(r);
          if ($('#r_def', bg).checked) cur().defaultRoutine = r.id; else if (cur().defaultRoutine === r.id) cur().defaultRoutine = null;
          save(); closeSheet(); render(); return;
        }
        if (act === 'del') { S.routines = S.routines.filter(x => x.id !== r.id); if (cur().defaultRoutine === r.id) cur().defaultRoutine = null; save(); closeSheet(); render(); return; }
        draw();
      });
    });
  };
  draw();
};

  persist() {
    // write/refresh log incrementally so nothing is lost if the phone dies
    const totalSec = this.entries.reduce((a, x) => a + x.sec, 0); if (!totalSec) return;
    const log = { id: this.plan.id + '_log', inst: this.plan.inst || cur().id, date: dayKey(new Date(this.startedAt)), startedAt: this.startedAt, mode: this.plan.mode, level: this.plan.level, totalSec, entries: this.entries };
    const ix = S.logs.findIndex(l => l.id === log.id); if (ix >= 0) S.logs[ix] = log; else S.logs.push(log); save();
  },
  advance() {
    if (this.idx < this.plan.items.length - 1) { this.idx++; this.resetItem(); this.paint(true); }
    else this.end();
  },
  skip() {
    const it = this.cur(); this.running = false; clearInterval(this.iv); Metro.stop();
    if (this.itemSec >= 20) return this.rateSheet();
    this.advance();
  },
  end() {
    this.running = false; clearInterval(this.iv); Metro.stop();
    const before = UI._streakBefore ?? 0;
    this.persist();
    const si = streakInfo();
    UI.summary = { totalSec: this.entries.reduce((a, x) => a + x.sec, 0), entries: this.entries.slice(), streak: si.streak, grew: si.streak > before, doneToday: si.doneToday, todaySec: si.todaySec };
    this.plan = null; go('summary');
  },
  quit() {
    const has = this.entries.length || this.itemSec >= 20;
    confirmSheet(has ? 'End session now? Practiced time is saved.' : 'Leave this session?', 'End session', () => {
      if (this.itemSec >= 20 && this.cur()) { const it = this.cur(); this.commit({ exId: it.exId || null, title: it.exId ? undefined : itemTitle(it), sec: this.itemSec, bpm: exById(it.exId) ? Metro.bpm : null, base: exById(it.exId)?.currentBpm || null }); }
      if (this.entries.length) this.end(); else { this.teardown(); this.plan = null; go('today'); }
    });
  },
  teardown() { this.running = false; clearInterval(this.iv); Metro.stop(); Metro.release(); try { this.wake?.release(); } catch (e) { } this.wake = null; },
  paintTimer() {
    const el = $('#ptimer'); if (!el) return; const rem = this.target() - this.itemSec;
    el.textContent = rem >= 0 ? fmtTime(rem) : '+' + fmtTime(-rem); el.classList.toggle('over', rem < 0);
    const tot = $('#ptotal'); if (tot) { const done = this.plan.items.slice(0, this.idx).reduce((a, i) => a + i.min * 60, 0) + Math.min(this.itemSec, this.target()); tot.textContent = `${fmtTime(planTotal(this.plan) * 60 - done)} left`; }
  },
  paint(full) { if (current === 'session') { if (full) render(); else { const b = $('#pplay'); if (b) b.innerHTML = this.running ? icon('pause') + ' Pause' : icon('play') + (this.itemSec > 0 ? ' Resume' : ' Start'); const m = $('#mtoggle'); if (m) m.classList.toggle('primary', Metro.on); } } },
};

function lineChart(series, labels, goal) {
  // series: [{ vals:[number|null], color, dash, name }]
  if (!Array.isArray(series) || typeof series[0] === 'number') series = [{ vals: series, color: 'var(--primary)' }];
  const W = 320, H = 160, pl = 30, pr = 8, pt = 12, pb = 22, n = labels.length;
  const all = series.flatMap(s => s.vals).filter(v => v != null).concat(goal ? [goal] : []);
  let mn = Math.min(...all), mx = Math.max(...all); if (mn === mx) { mn -= 5; mx += 5; } const padv = (mx - mn) * 0.1; mn -= padv; mx += padv;
  const x = i => pl + (n === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (n - 1)); const y = v => pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb);
  const ticks = [mn + padv, (mn + mx) / 2, mx - padv].map(v => Math.round(v));
  const lstep = Math.ceil(n / 6);
  const line = s => { let d = '', pen = false; s.vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; }); return d; };
  const step = s => { let d = ''; s.vals.forEach((v, i) => { if (v == null) return; d += d ? `H${x(i).toFixed(1)}V${y(v).toFixed(1)}` : `M${x(i).toFixed(1)},${y(v).toFixed(1)}`; }); return d; };
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(t) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${t}</text>`).join('')}
    ${goal ? `<line x1="${pl}" x2="${W - pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--flame)" stroke-dasharray="4 4"/><text x="${W - pr}" y="${y(goal) - 4}" font-size="10" text-anchor="end" fill="var(--flame)">goal ${goal}</text>` : ''}
    ${series.map(s => `<path d="${s.step ? step(s) : line(s)}" fill="none" stroke="${s.color}" stroke-width="${s.step ? 3 : 2}" ${s.dash ? 'stroke-dasharray="3 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>
      ${s.dots === false ? '' : s.vals.map((v, i) => v == null ? '' : `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"><title>${labels[i]}: ${v} BPM</title></circle>`).join('')}`).join('')}
    ${labels.map((l, i) => i % lstep === 0 || i === n - 1 ? `<text x="${x(i)}" y="${H - 6}" font-size="10" text-anchor="${n > 1 && i === 0 ? 'start' : n > 1 && i === n - 1 ? 'end' : 'middle'}" fill="var(--muted)">${esc(l)}</text>` : '').join('')}
  </svg>`;
}
function tempoChart(e) {
  const t = tempoSeries(e); if (t.labels.length < 2) return '';
  return `<div class="chart">${lineChart([{ vals: t.base, color: 'var(--ink)', step: true, dots: false, name: 'Base' }, { vals: t.max, color: 'var(--primary)', name: 'Daily max' }], t.labels, e.targetBpm)}</div>
    <div class="row small muted" style="gap:14px;margin-top:6px"><span><b style="color:var(--ink)">━</b> Base tempo</span><span><b style="color:var(--primary)">●</b> Daily max</span>${e.targetBpm ? '<span style="color:var(--flame)">┅ Goal</span>' : ''}</div>`;
}

    catch (e) { toast("Couldn't open that image"); return; } finally { URL.revokeObjectURL(url); }
  }
  let sel = null;
  openSheet(`<h3>Crop to the bars you need</h3><div class="hint">Drag across the area to keep. Or keep the whole thing.</div>
    <div class="crop" id="cropBox"><canvas id="cropCv"></canvas><div class="sel" id="cropSel" style="display:none"></div></div>
    <div class="row" style="margin-top:12px"><button class="btn grow" id="cropAll">Use whole</button><button class="btn primary grow" id="cropOk" disabled>Use selection</button></div>`, bg => {
    const cv = $('#cropCv', bg), box = $('#cropBox', bg), selEl = $('#cropSel', bg);
    cv.width = srcCanvas.width; cv.height = srcCanvas.height; cv.getContext('2d').drawImage(srcCanvas, 0, 0);
    let start = null;
    const pt = ev => { const r = box.getBoundingClientRect(); return { x: clamp(ev.clientX - r.left, 0, r.width), y: clamp(ev.clientY - r.top, 0, r.height) }; };
    const draw = () => { if (!sel) return; selEl.style.display = 'block'; Object.assign(selEl.style, { left: sel.x + 'px', top: sel.y + 'px', width: sel.w + 'px', height: sel.h + 'px' }); };
    box.addEventListener('pointerdown', ev => { box.setPointerCapture(ev.pointerId); start = pt(ev); sel = { x: start.x, y: start.y, w: 0, h: 0 }; draw(); });
    box.addEventListener('pointermove', ev => { if (!start) return; const p = pt(ev); sel = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) }; draw(); });
    box.addEventListener('pointerup', () => { start = null; $('#cropOk', bg).disabled = !(sel && sel.w > 12 && sel.h > 12); });
    const finish = async rect => {
      const sc = srcCanvas.width / box.getBoundingClientRect().width;
      const r = rect ? { x: rect.x * sc, y: rect.y * sc, w: rect.w * sc, h: rect.h * sc } : { x: 0, y: 0, w: srcCanvas.width, h: srcCanvas.height };
      const maxW = 1800, k = Math.min(1, maxW / r.w);
      const out = document.createElement('canvas'); out.width = Math.round(r.w * k); out.height = Math.round(r.h * k);
      const cx = out.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, out.width, out.height); cx.drawImage(srcCanvas, r.x, r.y, r.w, r.h, 0, 0, out.width, out.height);
      const blob = await new Promise(res => out.toBlob(res, 'image/jpeg', 0.88));
      const id = await putMedia(blob); UI.draft.images = exImages(UI.draft).concat(id); UI.draft.media = null; closeSheet(); render(); toast(`Page ${UI.draft.images.length} added`);
    };
    $('#cropAll', bg).onclick = () => finish(null);
    $('#cropOk', bg).onclick = () => finish(sel);
  });
}

/* ================= PDF (pdf.js, lazy) ================= */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function ensurePdf() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await loadScript(PDFJS + 'pdf.min.js');
  // load worker code into the page too, so it works where worker scripts from other hosts are blocked
  try { await loadScript(PDFJS + 'pdf.worker.min.js'); } catch (e) { }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  return window.pdfjsLib;
}
async function openPdfPicker(file) {
  toast('Opening PDF…');
  let pdf;
  try { const lib = await ensurePdf(); pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; }
  catch (e) { console.warn(e); toast("Couldn't open the PDF. Try a screenshot instead."); return; }
  let page = 1;
  const show = async () => {
    openSheet(`<h3>Pick a page</h3><div class="row between" style="margin:10px 0"><button class="btn small" id="pp">${icon('back')}</button><b>Page ${page} / ${pdf.numPages}</b><button class="btn small" id="pn" style="transform:scaleX(-1)">${icon('back')}</button></div>
      <div class="media" style="background:#fff"><canvas id="pdfCv" style="width:100%;display:block"></canvas></div>
      <button class="btn primary block" id="pUse">Use this page</button>`, async bg => {
      const pg = await pdf.getPage(page); const vp = pg.getViewport({ scale: 2 });
      const cv = $('#pdfCv', bg); cv.width = vp.width; cv.height = vp.height;
      await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      $('#pp', bg).onclick = () => { if (page > 1) { page--; show(); } };
      $('#pn', bg).onclick = () => { if (page < pdf.numPages) { page++; show(); } };
      $('#pUse', bg).onclick = () => { closeSheet(); openCropper(cv); };
    });
  };
  show();
}

const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
A.exportData = async () => {
  const media = {}; for (const e of S.exercises) for (const m of exImages(e)) { const b = await DB.get('media', m); if (b) media[m] = await blobToDataURL(b); }
  const blob = new Blob([JSON.stringify({ app: 'steadify', version: 1, exportedAt: new Date().toISOString(), state: S, media })], { type: 'application/json' });
  const fname = `steadify-backup-${dayKey()}.json`;
  try { const f = new File([blob], fname, { type: 'application/json' }); if (navigator.canShare?.({ files: [f] })) { await navigator.share({ files: [f], title: 'steadify backup' }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
async function importData(file) {
  if (!file) return;

    const j = JSON.parse(await file.text()); if (j.app !== 'steadify' || !j.state) throw 0;

  } catch (e) { toast("That file isn't a steadify backup"); }
}

const SAMPLE_DESC = {
  'Slow full strokes': `Full strokes from about 9–12 inches: 8 with the right hand, then 8 with the left.
• Let the stick bounce back up to the same height, don't hold it into the pad.
• Both hands should look and sound identical.
• Keep shoulders, wrists and grip relaxed. This sets up everything else.`,
  'Single stroke roll': `Alternate hands RLRL as even 16th notes.
• Both hands at exactly the same volume and height.
• If you can hear which hand is playing, slow down.
• Stay loose as the tempo rises. Tension is your speed limit.`,
  'Double stroke roll': `Two strokes per hand: RRLL.
• The second stroke tends to be weaker. Make it as strong as the first.
• Slow: two separate wrist strokes. Faster: let the second one come from the rebound and fingers.
• Goal: it should sound as even as a single stroke roll.`,
  'Weak hand singles': `Steady 16th notes with your weak hand only.
• First play 4 bars with your strong hand as a reference, then 4 bars weak hand.
• Copy the strong hand's height, sound and relaxation.
• Stop and shake out if your forearm tightens.`,
  'Paradiddle': `RLRR LRLL as 16th notes. The leading hand switches every beat.

  'Flam taps': `Each beat is a flam followed by a tap with the same hand: lR R rL L (small letter = grace note).

function addSamples(inst = cur()) {
  const list = SAMPLES[inst.kind] || [];
  const mk = (name, o) => ({ id: uid(), inst: inst.id, name, tags: [], where: 'pad', warmup: false, startBpm: 60, targetBpm: 120, step: 4, sticking: '', notes: '', link: '', media: null, youtube: null, createdAt: Date.now(), sample: true, ...o, notes: o.notes || SAMPLE_DESC[name] || '', descV: 2, currentBpm: o.startBpm === null ? null : (o.startBpm || 60), baseSince: dayKey() });
  const ex = list.map(([n, o]) => mk(n, o));
  S.exercises.push(...ex);
  if (!S.routines.some(r => r.inst === inst.id) && ex.some(e => e.warmup)) { const r = { id: uid(), inst: inst.id, name: 'Basic warm-up', items: ex.filter(e => e.warmup).map(e => ({ exId: e.id, min: 2 })) }; S.routines.push(r); inst.defaultRoutine = r.id; }
}

/* ================= boot ================= */
(async function boot() {
  await load();
  applyTheme();
  // v2.0: add "Warm Up Wobble by SariDrums" once to every drums instrument that doesn't have it yet
  if (!S.settings.wobbleAdded) {
    S.instruments.filter(i => i.kind === 'drums').forEach(inst => {
      if (S.exercises.some(e => e.inst === inst.id && /warm up wobble/i.test(e.name))) return;
      const [name, o] = WOBBLE;
      S.exercises.push({ id: uid(), inst: inst.id, name, tags: [], where: 'pad', warmup: false, step: 4, sticking: '', link: '', media: null, images: [], createdAt: Date.now(), ...o, descV: 2, currentBpm: o.startBpm, baseSince: dayKey() });
    });
    S.settings.wobbleAdded = true; save();
  }
  // v1.5: give sample exercises a proper description (only if the user hasn't written their own)
  const OLD = ['Big relaxed strokes, 8 per hand. Focus on rebound and even height.', 'Only your weak hand. Match the sound of your strong hand.', 'Accent the first note of each group.', 'Rotate one accent through the 8 notes. Taps stay low.', 'Backbeat loud, ghost notes barely audible.', ''];
  S.exercises.forEach(e => { if (e.sample && e.descV !== 2 && SAMPLE_DESC[e.name] && OLD.includes((e.notes || '').trim())) { e.notes = SAMPLE_DESC[e.name]; e.descV = 2; } });
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => { });
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claudeusercontent|claude\.ai/.test(location.host)) navigator.serviceWorker.register('sw.js').catch(() => { });
  render();
})();
