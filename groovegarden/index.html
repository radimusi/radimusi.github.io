const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let SIDX=[];
function buildIndex(){
  SIDX=[]; let n=0; const V=T('views');
  const viewName=id=>V[VIEW_IDS.indexOf(id)]||'';
  const sel='.lvl, .card.accent, .callout, table.stack-m tr, .live-t tr, ul.clean > li, .step, .appr, details.proc, details.dadd';
  $$('section.view').forEach(sec=>{
    const view=sec.id.slice(2); if(view==='konvertor'||view==='planovac') return;
    sec.querySelectorAll(sel).forEach(el=>{
      if(el.closest('#wizard')||el.closest('#doomCheck')) return;
      if(el.parentElement.closest('.callout, .appr, details.proc, .step')) return;
      if(el.tagName==='TR'&&el.querySelector('th')) return;
      const cl=el.cloneNode(true); cl.querySelectorAll('.num,.tag,.dtag').forEach(x=>x.remove()); cl.querySelectorAll('li,td,div,p,summary,h3,b,span.k').forEach(x=>x.append(' ')); let text=cl.textContent.replace(/\s+/g,' ').replace(/\s*\+\s*/g,'+').replace(/ ([,.)])/g,'$1').trim(); if(text.length<4) return;
      let title='';
      const h=el.querySelector('.ttl')||el.querySelector('h3')||el.querySelector('b.t')||el.querySelector('.n'); if(h){const hc=h.cloneNode(true);hc.querySelectorAll('.dtag').forEach(x=>x.remove());hc.querySelectorAll('small').forEach(x=>x.prepend(' · '));title=hc.textContent.replace(/\s+/g,' ').trim()}
      if(!title){const c=el.closest('.card'); const ch=c&&c.querySelector('h3'); if(ch) title=ch.textContent.trim()}
      if(!title){let p=el.closest('.card')||el; while(p&&p.previousElementSibling&&p.previousElementSibling.tagName!=='H2')p=p.previousElementSibling; const h2=p&&p.previousElementSibling; title=h2?h2.textContent.trim():sec.querySelector('h1').textContent.trim()}
      if(el.classList.contains('step')){const ph=el.closest('details.phase'); const st=el.querySelector('.st').cloneNode(true); st.querySelectorAll('.tag,.dtag').forEach(x=>x.remove()); title=st.textContent.trim(); }
      if(title&&text.startsWith(title)) text=text.slice(title.length).trim();
      SIDX.push({view,el,title,text,ctx:viewName(view),proc:el.classList.contains('proc'),hay:norm(title+' '+text)});
    });
  });
  scList().forEach(({r,conf})=>SIDX.push({view:'zkratky',sc:r[1],title:r[1],text:r[0].replace(/\+/g,' + ')+(conf?' · DOOM: '+conf:''),ctx:viewName('zkratky'),hay:norm(r[0]+' '+r[1]+' '+SC_CATS[r[2]]+' '+(conf||''))}));
}
function tokMatch(hay,t){if(hay.includes(t))return true;const s=SYN[t];return !!(s&&s.some(x=>hay.includes(norm(x))))}
function runSearch(q){
  const toks=norm(q).split(/[^a-z0-9/]+/).filter(t=>t.length>1); if(!toks.length) return [];
  const res=[];
  for(const it of SIDX){ if(!toks.every(t=>tokMatch(it.hay,t))) continue;
    const th=norm(it.title); let sc=0; toks.forEach(t=>{if(th.includes(t))sc+=3; else sc+=1});
    if(it.proc) sc+=2; if(it.sc!=null) sc+=1; res.push({it,sc}) }
  return res.sort((a,b)=>b.sc-a.sc).slice(0,30).map(r=>r.it);
}
function snippet(text,toks){
  const nt=norm(text); let pos=-1; for(const t of toks){pos=nt.indexOf(t);if(pos>=0)break}
  let s=Math.max(0,pos-50); let out=(s>0?'…':'')+text.slice(s,s+150)+(text.length>s+150?'…':'');
  let h=esc(out); toks.forEach(t=>{ if(t.length<2)return; const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); h=h.replace(re,'<mark>$1</mark>') });
  return h;
}
function renderResults(){
  const q=$('#gSearch').value, box=$('#gResults');
  if(!q.trim()){box.classList.remove('on');return}
  if(!SIDX.length) buildIndex();
  const toks=norm(q).split(/[^a-z0-9/]+/).filter(t=>t.length>1);
  const res=runSearch(q);
  box.innerHTML=res.length?res.map((r,i)=>`<button class="gr" data-i="${i}"><span class="gr-ctx">${esc(r.ctx)}${r.proc?' · '+esc(T('procTag')):''}</span><b>${esc(r.title.slice(0,90))}</b><span class="gr-s">${snippet(r.text,toks)}</span></button>`).join(''):`<div class="dim" style="padding:12px">${T('noResults')}</div>`;
  box.classList.add('on');
  $$('#gResults .gr').forEach(b=>b.onclick=()=>goResult(res[+b.dataset.i]));
}
function flash(el){if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
function goResult(r){
  $('#gResults').classList.remove('on'); $('#gSearch').blur();
  if(location.hash!=='#'+r.view) location.hash=r.view; else route(false);
  setTimeout(()=>{
    if(r.sc!=null){scCat='all';$('#scSearch').value=r.sc;renderSC();flash($('#scTable tr:nth-child(2)'));return}
    const el=r.el; if(!el||!el.isConnected){buildIndex();return}
    const d=el.closest('details'); if(d) d.open=true; if(el.tagName==='DETAILS') el.open=true;
    flash(el);
  },80);
}
function procList(){
  if(!isDoom()) return PROC_DEF.map(x=>({...x,src:'roland'}));
  const ex=Object.fromEntries(DOOM_PROC.extra.map(x=>[x.id,{...x,src:'doom'}]));
  const base=Object.fromEntries(PROC_DEF.map(x=>[x.id,x]));
  const ov=id=>({...base[id],...DOOM_PROC.over[id],src:'doom'});
  const doom=[ex.doomopen,ov('record'),ov('switch'),ov('patbank'),ex.doominst,ex.doompiano,ex.doomarp,ex.doomplock,ex.doomtools,ov('mute'),ex.doomsc,ov('resample'),ov('efxmotion'),ov('chain')];
  const rest=PROC_DEF.filter(x=>!DOOM_PROC.over[x.id]).map(x=>({...x,src:'roland'}));
  return doom.concat(rest);
}
function renderInlineProcs(){
  const L=Object.fromEntries(procList().map(x=>[x.id,x]));
  $$('.dinline').forEach(box=>{
    const ps=box.dataset.procs.split(',').map(id=>L[id]).filter(Boolean);
    box.innerHTML=ps.length?`<div class="dil-h">${T('stepByStep')}</div>`+ps.map(p=>{const [t,what,steps,note]=p[S.lang];const d=p.src==='doom';return `<div class="dil ${d?'dl':''}"><b>${t}</b><ol>${steps.map(x=>`<li>${kx(x)}</li>`).join('')}</ol>${note?`<p class="muted">${kx(note)}</p>`:''}</div>`}).join(''):'';
  });
}
function renderProcs(){
  renderInlineProcs();
  const box=$('#procList'); if(!box) return;
  const L=procList().filter(x=>typeof scSrc==='undefined'||scSrc==='both'||(scSrc==='doom')===(x.src==='doom')); let lastSrc=null;
  box.innerHTML=L.map(p=>{const hdr=isDoom()&&p.src!==lastSrc?(lastSrc=p.src,`<h3 class="procgrp">${p.src==='doom'?'<img class="navlogo" src="'+DOOM_LOGO+'" alt="DOOM OS"> procedures':'SP Original procedures <span class="dim" style="font-weight:400;font-size:13px">– work the same with DOOM OS installed (outside the DOOM OS screen)</span>'}</h3>`):'';return hdr+(()=>{const [t,what,steps,note]=p[S.lang];const d=p.src==='doom';return `<details class="proc phase ${d?'dproc':''}" id="proc-${p.id}"><summary><span class="num">↳</span><div><div class="ttl">${t}</div><div class="sub">${what}</div></div></summary><div class="body"><ol style="margin:0;padding-left:18px">${steps.map(s=>`<li style="margin:5px 0">${kx(s)}</li>`).join('')}</ol>${note?`<p class="muted" style="font-size:13.5px;margin:10px 0 0">${kx(note)}</p>`:''}<p style="margin:10px 0 0;font-size:13px"><a href="${d?DOOM_URL:MAN+p.url+'.html'}" target="_blank" rel="noopener">${d?T('doomManLink'):T('manLink')}</a></p></div></details>`})()}).join('');
}
function initSearch(){
  const s=$('#gSearch'); s.placeholder=T('searchPh');
  s.oninput=renderResults; s.onfocus=()=>{buildIndex(); if(s.value.trim())renderResults()};
  s.onkeydown=e=>{if(e.key==='Escape'){s.value='';renderResults();s.blur()} if(e.key==='Enter'){const f=$('#gResults .gr');if(f)f.click()}};
  document.addEventListener('click',e=>{if(!e.target.closest('.gsearch'))$('#gResults').classList.remove('on')});
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();s.focus()}});
}

 cs:{level:'Úroveň',goal:'Cíl',exam:'Zkouška',examDone:'Zkouška splněna',locked:n=>`Zamčeno – nejdřív splň zkoušku úrovně ${n}.`,peek:'Zobrazit i tak',done:'Hotovo',progress:(a,b)=>`${a}/${b}`},
 en:{level:'Level',goal:'Goal',exam:'Exam',examDone:'Exam passed',locked:n=>`Locked – pass the level ${n} exam first.`,peek:'Show anyway',done:'Done',progress:(a,b)=>`${a}/${b}`}

function renderLevels(){
  const box=$('#levels'); if(!box) return;
  S.train=S.train||{d:{},x:{},peek:{}};
  const L=LEVELS[S.lang], U=LV_UI[S.lang];
  let unlocked=true;
  box.innerHTML=L.map((lv,li)=>{
    const done=lv.drills.filter((_,di)=>S.train.d[li+'-'+di]).length, ex=!!S.train.x[li];
    const isLocked=!unlocked&&!S.train.peek[li]; const wasLocked=!unlocked;
    unlocked=unlocked&&ex;
    const pct=Math.round((done+(ex?1:0))/(lv.drills.length+1)*100);
    return `<details class="phase lvlbox ${ex?'done':''} ${wasLocked?'locked':''}" data-l="${li}" ${(!wasLocked&&!ex)||S.train.peek[li]?'open':''}>
      <summary><span class="num">${ex?'✓':li+1}</span><div><div class="ttl">${U.level} ${li+1} · ${lv.t}</div><div class="sub">${U.goal}: ${lv.goal}</div></div>
      <span class="cnt"><span class="lvbar"><i style="width:${pct}%"></i></span> ${U.progress(done+(ex?1:0),lv.drills.length+1)}</span></summary>
      <div class="body">${isLocked?`<p class="dim" style="margin:6px 0">${U.locked(li)} <button class="btn sm ghost" data-peek="${li}">${U.peek}</button></p>`:
       lv.drills.map((d,di)=>{const id=li+'-'+di;return `<label class="step ${S.train.d[id]?'ok':''}"><input type="checkbox" data-d="${id}" ${S.train.d[id]?'checked':''}><div><div class="st">${d.t} <span class="tag" style="margin-left:6px">${d.time}</span></div><div class="how">${kx(d.d)}</div></div></label>`}).join('')+
       `<div class="exam ${ex?'ok':''}"><label class="step" style="border:none"><input type="checkbox" data-x="${li}" ${ex?'checked':''}><div><div class="st">${ex?U.examDone:U.exam}</div><div class="how">${kx(lv.exam)}</div></div></label></div>`}
      </div></details>`}).join('');
  $$('#levels [data-d]').forEach(c=>c.onchange=()=>{S.train.d[c.dataset.d]=c.checked;save();renderLevels()});
  $$('#levels [data-x]').forEach(c=>c.onchange=()=>{S.train.x[c.dataset.x]=c.checked;save();renderLevels()});
  $$('#levels [data-peek]').forEach(b=>b.onclick=e=>{e.preventDefault();S.train.peek[b.dataset.peek]=1;save();renderLevels()});
}

const isDoom=()=>S.fw==='doom';
function renderDoomFeat(){
  const box=$('#doomFeat'); if(!box) return;
  box.innerHTML=DOOM_FEAT[S.lang].map(f=>`<button class="card dfeat" data-p="${f[3]}"><h3>${f[0]}</h3><p class="muted">${f[1]}</p><span class="dk">${esc(f[2])}</span></button>`).join('');
  $$('#doomFeat .dfeat').forEach(b=>b.onclick=()=>{location.hash='zkratky';setTimeout(()=>{const d=$('#proc-'+b.dataset.p);if(d){d.open=true;flash(d)}},120)});
}

setLang(S.lang,true);
