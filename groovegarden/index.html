<style>
:root{
  --bg:#141416; --panel:#1d1d21; --panel2:#25252b; --line:#34343c;
  --text:#ecebe6; --muted:#a3a29c; --dim:#76757f;
  --orange:#ff7a1a; --pink:#ff4fa3; --green:#3fd27b; --blue:#4fb3ff; --purple:#a77bff; --yellow:#ffd23f; --red:#ff4d4d; --white:#e9e9e9;
  --radius:12px;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.55}
a{color:var(--orange)}
header{position:sticky;top:0;z-index:20;background:rgba(20,20,22,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto;padding:12px 20px 0}
.logo{font-weight:700;letter-spacing:.02em;font-size:18px;white-space:nowrap}
.logo span{color:var(--orange)}
.logo span.full{color:var(--text)}
.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bar{width:140px;height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--pink));width:0}
nav{display:flex;gap:4px;max-width:1180px;margin:0 auto;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:8px 8px 0 0;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
nav a:hover{color:var(--text)}
nav a.on{color:var(--text);border-bottom-color:var(--orange)}
nav a b{font-family:var(--mono);font-weight:400;color:var(--dim);margin-right:6px;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
section.view{display:none}
section.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
h1{font-size:34px;line-height:1.15;margin:0 0 10px}
h2{font-size:24px;margin:34px 0 10px}
h3{font-size:18px;margin:22px 0 8px}
p.lead{font-size:18px;color:var(--muted);max-width:760px;margin-top:0}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{margin-top:0}
.card.accent{border-left:3px solid var(--orange)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--muted);margin:0 4px 4px 0;border:1px solid var(--line)}
kbd,.k{font-family:var(--mono);font-size:12.5px;background:#2b2b31;border:1px solid #45454f;border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap;color:#fff}
.plus{color:var(--dim);margin:0 3px}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:6px 0;border-bottom:1px dashed var(--line)}
ul.clean li:last-child{border-bottom:none}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--orange)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#111;font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent}
input,select,textarea{font:inherit;font-size:14px;background:#111114;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.callout{background:linear-gradient(135deg,rgba(255,122,26,.12),rgba(255,79,163,.08));border:1px solid rgba(255,122,26,.35);border-radius:var(--radius);padding:16px 18px;margin:16px 0}
.callout.neutral{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--orange)}
.callout.blue{background:rgba(79,179,255,.08);border-color:rgba(79,179,255,.35)}
.callout.red{background:rgba(255,77,77,.08);border-color:rgba(255,77,77,.35)}
.callout b.t{display:block;margin-bottom:4px}

/* model diagram */
.stack{display:grid;gap:8px}
.lvl{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.lvl .n{font-family:var(--mono);font-size:13px;color:var(--orange)}
.lvl .n small{display:block;color:var(--dim)}

/* approach cards */
.appr{cursor:pointer;transition:border-color .15s,transform .15s;position:relative}
.appr:hover{border-color:var(--orange);transform:translateY(-2px)}
.appr .letter{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:28px;color:var(--panel2);font-weight:600}
.appr.sel{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.meter{display:flex;gap:3px;margin-top:2px}
.meter i{width:16px;height:5px;border-radius:2px;background:var(--panel2)}
.meter i.f{background:var(--orange)}
.mrow{display:grid;grid-template-columns:110px 1fr;font-size:12.5px;color:var(--muted);align-items:center;margin-top:4px}
.detail{margin-top:18px}

/* wizard */
.q{margin:16px 0}
.q .opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:8px}
.opt{border:1px solid var(--line);background:var(--panel);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14.5px}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--orange);background:rgba(255,122,26,.1)}
.result-bar{display:grid;grid-template-columns:200px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.result-bar .track{height:10px;background:#111114;border-radius:6px;overflow:hidden}
.result-bar .track i{display:block;height:100%;background:var(--orange)}

/* workflow */
.phase{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:12px 0;overflow:hidden}
.phase>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:14px}
.phase>summary::-webkit-details-marker{display:none}
.phase .num{font-family:var(--mono);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:14px;flex:none}
.phase.done .num{background:var(--green);color:#111}
.phase .ttl{font-weight:600;font-size:17px}
.phase .sub{font-size:13px;color:var(--muted)}
.phase .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.phase .body{padding:0 18px 16px 66px}
.step{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.step input{width:18px;height:18px;margin-top:3px;accent-color:var(--green)}
.step.ok .st{text-decoration:line-through;color:var(--dim)}
.step .st{font-weight:500}
.step .how{font-size:14px;color:var(--muted);margin-top:3px}
.step .how .k{font-size:12px}
.why{font-size:13.5px;color:var(--muted);border-left:2px solid var(--purple);padding-left:10px;margin:10px 0 4px}

/* pads */
.planner{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px}
@media (max-width:860px){.planner{grid-template-columns:minmax(0,1fr)}.phase .body{padding-left:18px}}
@media (max-width:600px){.bar{display:none}.logo{font-size:15px}h1{font-size:27px}main{padding:20px 14px 60px}
 .sections .srow{grid-template-columns:22px 1fr 60px;}.sections .srow input[data-k=pat],.sections .srow input[data-k=note]{grid-column:2/4}.sections .srow .mini{grid-column:2/4}.sections .hdr{display:none}
 .lvl{grid-template-columns:1fr}.result-bar{grid-template-columns:120px 1fr 24px}.setlist li{grid-template-columns:24px 1fr auto}.setlist li>.k{display:none}
 .sc td:first-child{white-space:normal}}
.banks{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.banks button{font-family:var(--mono);width:36px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
.banks button.on{background:var(--orange);color:#111;border-color:var(--orange);font-weight:600}
.banks button.has{color:var(--text);border-color:#5a5a66}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#0e0e10;padding:12px;border-radius:14px;border:1px solid var(--line)}
.pad{aspect-ratio:1;border-radius:8px;background:#2a2a30;border:2px solid #3a3a42;cursor:pointer;position:relative;padding:6px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--text);font:inherit;overflow:hidden}
.pad .pn{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.pad .nm{font-size:12px;line-height:1.2;font-weight:600;word-break:break-word}
.pad .fl{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.pad.sel{outline:2px solid #fff;outline-offset:2px}
.pad .glow{position:absolute;inset:0;opacity:.18;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sections .srow{display:grid;grid-template-columns:28px 1.2fr 70px 90px 2fr 60px;gap:6px;align-items:center;margin:6px 0}
.sections .srow input{padding:5px 7px;font-size:13px}
.sections .hdr{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.timeline{display:flex;height:34px;border-radius:7px;overflow:hidden;margin:12px 0;border:1px solid var(--line)}
.timeline div{display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#111;font-weight:600;overflow:hidden;white-space:nowrap;border-right:1px solid rgba(0,0,0,.3)}
.mini{display:flex;gap:2px}
.mini button{width:24px;height:24px;padding:0;font-size:12px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
.mini button:hover{color:var(--text)}
.setlist li{display:grid;grid-template-columns:28px 60px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}

/* shortcuts */
.sc-filter{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:5px 11px;border-radius:20px;font-size:13px;cursor:pointer}
.chip.on{background:var(--text);color:#111;border-color:var(--text)}
.sc td:first-child{width:38%;white-space:normal;line-height:2}
.sc tr.star td{background:rgba(255,122,26,.06)}
.star-b{cursor:pointer;color:var(--dim);background:none;border:none;font-size:16px}
.star-b.on{color:var(--yellow)}

/* timer */
.timer{font-family:var(--mono);font-size:44px;letter-spacing:.04em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:720px;width:100%;max-height:85vh;overflow:auto;padding:20px}
pre.out{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;background:#0e0e10;padding:12px;border-radius:8px;border:1px solid var(--line);max-height:50vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#111;padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.lang button{background:transparent;border:none;color:var(--muted);font-family:var(--mono);font-size:12px;padding:5px 9px;cursor:pointer}
.lang button.on{background:var(--text);color:#111}
footer{max-width:1180px;margin:0 auto;padding:30px 20px 60px;color:var(--dim);font-size:13px;border-top:1px solid var(--line)}


@media (max-width:960px){
 nav{flex-wrap:wrap;overflow:visible;gap:2px 2px;padding:8px 12px 4px}
 nav a{padding:6px 10px;font-size:13.5px;border-radius:6px}
 nav a b{display:none}
}
/* global search */
.gsearch{position:relative;flex:1;max-width:420px;margin-left:auto}
.gsearch input{padding:7px 11px;font-size:14px;background:#0f0f12}
#gResults{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:300px;max-height:65vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:40}
#gResults.on{display:block}
.gr{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);color:var(--text);padding:10px 12px;font:inherit;cursor:pointer}
.gr:hover,.gr:focus{background:var(--panel2)}
.gr b{display:block;font-size:14px;margin:1px 0 2px}
.gr-ctx{font-size:11px;color:var(--orange);text-transform:uppercase;letter-spacing:.05em}
.gr-s{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
mark{background:rgba(255,122,26,.35);color:inherit;border-radius:2px;padding:0 1px}
@keyframes flashk{0%{box-shadow:0 0 0 3px var(--orange)}100%{box-shadow:0 0 0 3px transparent}}
.flash{animation:flashk 2.2s ease-out}
.live-t tr{display:block;padding:9px 0;border-bottom:1px solid var(--line)}
.live-t tr:last-child{border-bottom:none}
.live-t td{display:block;border:none;padding:2px 0;text-align:left!important}
.live-t td:first-child{color:var(--muted);font-size:13.5px;margin-bottom:4px}
@media (max-width:600px){
 .gsearch{position:static;max-width:none}
 #gResults{left:10px;right:10px;min-width:0;top:100%}
 .progress{display:none}
}
/* converter */
.seg-wrap{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg{background:var(--panel);border:none;color:var(--muted);padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.seg.on{background:var(--orange);color:#111;font-weight:600}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed #4a4a55;border-radius:14px;padding:28px 16px;cursor:pointer;background:var(--panel);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--orange);background:rgba(255,122,26,.06)}
.drop-i{font-size:28px;color:var(--orange);line-height:1}
.cv-opts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 4px}
.btn:disabled{opacity:.45;cursor:default}
/* ---------- phone ---------- */
@media (hover:none){.btn.sm{min-height:36px;padding:6px 12px}.chip{padding:8px 13px}.mini button{width:32px;height:32px}.star-b{font-size:20px;padding:6px}}
@media (max-width:600px){
 .logo span.full{display:none}
 .top{padding:10px 14px 0;gap:10px}
 h2{font-size:20px;margin-top:28px}
 p.lead{font-size:16px}
 .card{padding:14px}
 .callout{padding:13px 14px}
 .grid.g3,.grid.g2{grid-template-columns:1fr}
 .phase>summary{padding:12px 14px;gap:10px}
 .phase .ttl{font-size:15.5px}
 .step .how{font-size:13.5px}
 /* tables → stacked cards */
 table.stack-m tr,#apprTable tr,#cvList tr,.live-t tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
 table.stack-m th,#apprTable tr:first-child,#cvList tr:first-child{display:none}
 table.stack-m td,#apprTable td,#cvList td,.live-t td{display:block;border:none;padding:3px 4px;text-align:left!important;width:auto!important}
 #cvList td:first-child{float:right}
 #cvList td:nth-child(3)::before,#cvList td:nth-child(5)::before{content:attr(data-l) ' ';color:var(--dim);font-size:12px}
 #cvList td:nth-child(3),#cvList td:nth-child(5){display:inline-block}
 #cvList td:last-child{text-align:right!important}
 .sc tr{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--line)}
 .sc tr:first-child{display:none}
 .sc td{border:none;padding:6px 4px}
 .sc td:nth-child(1){grid-column:1/2}.sc td:nth-child(4){grid-column:2/3;grid-row:1/3}
 .sc td:nth-child(2){grid-column:1/2;padding-top:0}.sc td:nth-child(3){display:none}
 .modal{padding:0;align-items:flex-end}
 .modal .box{max-height:92vh;border-radius:14px 14px 0 0}
 .timer{font-size:38px}
 .pads{gap:6px;padding:8px}
 .pad .nm{font-size:11px}
 .pad .fl{font-size:8.5px}
 .drop{padding:22px 12px}
 #apprTable td[data-l]::before{content:attr(data-l);display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 2px;color:var(--muted)}
 #apprTable td.pro::before{color:var(--green)} #apprTable td.con::before{color:var(--red)}
}
@media print{
  header,nav,footer,.noprint{display:none!important}
  body{background:#fff;color:#000}
  section.view{display:none!important}
  section.view.printme{display:block!important}
}

  --orange:#b8327f; --pink:#cf3f98; --green:#3f7a52; --blue:#3d5ea8; --purple:#7a5fb0; --yellow:#8a6d10; --red:#b0302a; --white:#eef0d6;

a{color:var(--ink)}
::selection{background:#cf3f98;color:#fff}

/* header + nav */
header{background:rgba(200,213,140,.95);border-bottom:2px solid var(--ink);backdrop-filter:none}
.top{max-width:1240px;padding:14px 24px 0}
.logo{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.04em;color:#fff!important;-webkit-text-stroke:1px var(--ink);text-shadow:1px 1px 0 var(--ink),2px 2px 0 var(--ink),3px 3px 0 var(--ink)}
.logo span,.logo span.full{color:#fff}
.progress{font-family:var(--pixel);font-size:20px;color:var(--ink)}
.bar{height:10px;background:var(--panel);border:1.5px solid var(--ink);border-radius:6px}
.bar i{background:var(--green)}
.lang{border:1.5px solid var(--ink);border-radius:999px}
.lang button{font-family:var(--pixel);font-size:18px;color:var(--ink);padding:3px 11px}
.lang button.on{background:var(--ink);color:var(--panel)}
nav{max-width:1240px;padding:8px 18px 0;gap:2px 18px}
nav a{font-family:var(--pixel);font-size:22px;letter-spacing:.03em;color:var(--ink);padding:6px 2px 4px;border-radius:0;border-bottom:3px solid transparent}
nav a:hover{color:var(--ink);border-bottom-color:var(--line)}
nav a.on{color:var(--ink);border-bottom-color:var(--ink)}
nav a b{display:none}
main{max-width:1240px;padding:32px 24px 80px}
footer{max-width:1240px;color:var(--dim);border-top:1.5px solid var(--ink)}

/* type */
h1{font-family:var(--display);font-weight:900;font-size:60px;line-height:1;letter-spacing:.04em;color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:1px 1px 0 var(--ink),2px 2px 0 var(--ink),3px 3px 0 var(--ink),4px 4px 0 var(--ink);margin:0 0 18px}
h2{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:-.01em}
h3{font-family:var(--mono);font-weight:700;font-size:16.5px}
p.lead{font-size:16.5px;color:var(--muted);line-height:1.65}

/* cards, callouts */
.card{background:var(--panel);border:2px solid var(--ink);border-radius:var(--radius)}
.card.accent{border-left:2px solid var(--ink)}
.card.accent h3{display:inline-block}
.tag{background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-family:var(--pixel);font-size:16px;padding:0 8px}
.callout{background:var(--panel);border:2px solid var(--ink);border-radius:var(--radius)}
.callout.blue{background:#dfe6ee;border-color:var(--blue)}
.callout.red{background:var(--device);border-color:var(--ink);color:var(--device-text)}
.callout.red b.t{font-family:var(--pixel);font-size:22px;letter-spacing:.06em;color:#f4f4f0;font-weight:400}
.callout.red .k{background:#6f6e73;color:#f1efe8;border-color:#0f0f10}
.lvl{background:var(--panel);border:2px solid var(--ink);border-radius:12px}
.lvl .n{font-family:var(--pixel);font-size:22px;color:var(--ink);line-height:1.1}
.lvl .n small{font-family:var(--mono);font-size:12px;color:var(--dim)}

/* keys */
kbd,.k{font-family:var(--mono);font-weight:700;font-size:12px;background:#6f6e73;color:#f1efe8;border:1.5px solid #0f0f10;border-bottom-width:3px;border-radius:7px;padding:1px 7px}

/* buttons + forms */
.btn{background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:10px;font-family:var(--mono);font-size:13.5px}
.btn:hover{border-color:var(--ink);background:#f6f7e6}
.btn.pri{background:var(--device);color:var(--device-text);border-color:var(--ink);font-family:var(--pixel);font-size:21px;font-weight:400;letter-spacing:.06em;padding:4px 16px}
.btn.pri:hover{background:#3a393d}
.btn.ghost{background:transparent}
input,select,textarea{background:#f6f7e6;color:var(--ink);border:1.5px solid var(--ink);border-radius:8px;font-family:var(--mono)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pink);outline-offset:1px}
label.f{color:var(--muted)}
.chip{background:var(--panel);border:1.5px solid var(--ink);color:var(--ink);font-family:var(--pixel);font-size:18px;padding:2px 12px}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.opt{background:var(--panel);border:1.5px solid var(--ink)}
.opt:hover{background:#f6f7e6}
.opt.on{background:#f3d9e8;border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)}

/* approach cards */
.appr:hover{border-color:var(--ink)}
.appr.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.appr .letter{font-family:var(--display);font-weight:900;font-size:40px;color:#fff;-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.meter i{background:var(--panel2);border:1px solid var(--line)}
.meter i.f{background:var(--pink);border-color:var(--ink)}
.result-bar .track{background:var(--panel);border:1.5px solid var(--ink)}
.result-bar .track i{background:var(--pink)}

/* workflow */
.phase{background:var(--panel);border:2px solid var(--ink);border-radius:var(--radius)}
.phase .num{background:var(--panel2);border:1.5px solid var(--ink);font-family:var(--pixel);font-size:20px}
.phase.done .num{background:var(--green);color:#fff}
.phase .ttl{font-family:var(--mono)}
.phase .cnt{font-family:var(--pixel);font-size:18px;color:var(--dim)}
.step{border-top:1px dashed var(--line)}
.step input{accent-color:var(--green)}
.why{border-left-color:var(--pink)}

/* planner: device look */
.banks button{background:var(--panel);border:1.5px solid var(--ink);color:var(--ink);font-family:var(--pixel);font-size:19px}
.banks button.has{background:#f6f7e6;border-color:var(--ink)}
.banks button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pads{background:var(--device);border:2px solid var(--ink);border-radius:16px}
.pad{background:#3a393f;border:1.5px solid #141416;color:#eef0d6}
.pad .pn{font-family:var(--pixel);font-size:16px;color:#e08a3c}
.pad .nm{color:#f4f4f0}
.pad .fl{color:#b9b8bf}
.pad .glow{opacity:.55}
.pad.sel{outline:2px solid var(--panel)}
.legend{color:var(--muted)}
.timeline{border:1.5px solid var(--ink)}
.timeline div{color:var(--ink);border-right-color:var(--ink)}
.mini button{background:var(--panel);border:1px solid var(--ink);color:var(--ink)}
.setlist li{border-bottom-color:var(--line)}
ul.clean li{border-bottom-color:var(--line)}

/* tables */
th{font-family:var(--pixel);font-size:18px;font-weight:400;color:var(--muted);letter-spacing:.05em}
th,td{border-bottom-color:var(--line)}
.sc tr.star td{background:rgba(207,63,152,.08)}
.star-b{color:var(--dim)}
.star-b.on{color:var(--pink)}

/* misc */
.timer{font-family:var(--pixel);font-size:72px;letter-spacing:.04em;background:#050506;color:#f4f4f0;border:3px solid #45454b;border-radius:14px;display:inline-block;padding:0 22px;line-height:1.15}
.modal{background:rgba(27,29,23,.55)}
.modal .box{background:var(--panel);border:2px solid var(--ink)}
pre.out{background:var(--device);color:var(--device-text);border:1.5px solid var(--ink)}
.toast{background:var(--ink);color:var(--panel);font-family:var(--pixel);font-size:20px}
.drop{background:var(--panel);border:2px dashed var(--ink)}
.drop:hover,.drop.over{border-color:var(--pink);background:#f6f7e6}
.drop-i{color:var(--pink)}

/* start hero */
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:28px 48px;margin:4px 0 30px}
.hero-t{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:18px}
.hero-t h1{font-size:80px;margin:0}
.hero-t p.lead{margin:0;max-width:560px}
.eyebrow{font-family:var(--pixel);font-size:22px;letter-spacing:.08em;margin:0}
.press{align-self:flex-start;display:inline-flex;gap:10px;background:var(--device);color:var(--device-text);border:1.5px solid var(--ink);border-radius:10px;padding:5px 14px;font-family:var(--pixel);font-size:21px;letter-spacing:.08em;text-decoration:none}
.press span{color:#9b9d8a}
.press:hover{background:#3a393d;color:#eef0d6}
.hero-img{flex:0 1 540px;width:540px;max-width:100%;aspect-ratio:16/10;object-fit:cover;border:2px solid var(--ink);border-radius:18px;display:block}

@media (max-width:960px){
 nav{gap:0 14px;padding:6px 14px 2px}
 nav a{font-size:20px;padding:4px 2px}
}
@media (max-width:600px){
 .top{padding:10px 14px 0}
 .logo{font-size:24px}
 h1{font-size:42px}
 .hero-t h1{font-size:54px}
 .hero{gap:20px}
 main{padding:22px 14px 60px}
 .timer{font-size:56px}
}
@media print{body::after{display:none}}

/* ---- additions on top of the jungle theme ---- */
.gsearch input{background:#f6f7e6}
#gResults{background:var(--panel);border:2px solid var(--ink)}
.gr{color:var(--ink);border-bottom-color:var(--line)}
.gr:hover,.gr:focus{background:#f6f7e6}
.gr-ctx{color:var(--orange);font-family:var(--pixel);font-size:16px;letter-spacing:.06em}
.gr-s{color:var(--muted)}
mark{background:rgba(207,63,152,.22)}
@keyframes flashk{0%{box-shadow:0 0 0 4px var(--pink)}100%{box-shadow:0 0 0 4px transparent}}
.seg-wrap{border:1.5px solid var(--ink);border-radius:10px}
.seg{background:var(--panel);color:var(--ink);font-family:var(--mono)}
.seg.on{background:var(--ink);color:var(--panel)}
/* approach cards: dark device look */
.appr{background:var(--device);border-color:var(--ink);color:var(--device-text)}
.appr h3{color:#f4f4f0;padding-right:34px}
.appr .muted{color:#b9b8bf}
.appr .mrow{color:#b9b8bf}
.appr .meter i{background:#45444a;border-color:#141416}
.appr .meter i.f{background:var(--pink);border-color:#141416}
.appr:hover{border-color:var(--pink)}
.appr.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.appr .letter{color:#d6d8c4;-webkit-text-stroke:1px #141416;text-shadow:2px 2px 0 #141416}
.callout.neutral{background:var(--device);color:var(--device-text);border:2px solid var(--ink)}
.callout.neutral b,.callout.neutral b.t{color:#f4f4f0}
.callout.neutral .dim{color:#9b9d8a}
.callout.neutral .result-bar .track{background:#1f1e21;border-color:#141416}
.callout.neutral .btn{background:#3a393f;color:#f1efe8;border-color:#141416}
.callout.neutral .btn.pri{background:var(--pink);color:#fff}
.callout.neutral .btn.ghost{background:transparent}
.callout.neutral a.btn{color:#f1efe8}
#apprDetail>.card{background:var(--device);color:var(--device-text);border-color:var(--ink)}
#apprDetail>.card h2,#apprDetail>.card h3{color:#f4f4f0}
#apprDetail>.card .muted{color:#b9b8bf}

a.btn{text-decoration:none;display:inline-block}
.callout.neutral a.btn,.callout.neutral .btn.ghost{background:var(--panel);color:var(--ink);border:1.5px solid #141416}
.callout.neutral a.btn:hover,.callout.neutral .btn.ghost:hover{background:#f6f7e6;border-color:var(--pink)}

/* layout tweaks */
nav{justify-content:center}
.gsearch{margin-left:auto;max-width:280px}
.wfprog{display:flex;align-items:center;gap:10px;margin:6px 0 4px;font-family:var(--pixel);font-size:20px;color:var(--ink)}
.wfprog .bar{width:220px;height:10px}
.wfprog .dim{font-family:var(--mono);font-size:13px}
/* training levels */
.lvbar{display:inline-block;width:70px;height:8px;border:1.5px solid var(--ink);border-radius:5px;background:var(--panel);vertical-align:middle;overflow:hidden;margin-right:6px}
.lvbar i{display:block;height:100%;background:var(--green)}
.lvlbox.locked>summary{opacity:.6}
.exam{margin-top:10px;background:var(--device);color:var(--device-text);border:2px solid var(--ink);border-radius:12px;padding:4px 12px}
.exam .st{font-family:var(--pixel);font-size:20px;letter-spacing:.05em;color:#f4f4f0}
.exam .how{color:#c9cbb8}
.exam .k{background:#6f6e73;color:#f1efe8;border-color:#0f0f10}
.exam.ok .st{color:var(--green)}

/* comparison table: wrap, then stack on narrower screens */
#apprTable{table-layout:fixed;width:100%}
#apprTable td,#apprTable th{word-wrap:break-word;overflow-wrap:anywhere}
@media (max-width:860px){
 #apprTable tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
 #apprTable tr:first-child{display:none}
 #apprTable td{display:block;border:none;padding:3px 4px;text-align:left!important;width:auto!important}
 #apprTable td[data-l]::before{content:attr(data-l);display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 2px;color:var(--muted)}
 #apprTable td.pro::before{color:var(--green)} #apprTable td.con::before{color:var(--red)}
}

@media (max-width:600px){
 .sections .srow{grid-template-columns:22px 1fr 64px}
 .sections .srow input[data-k=pat],.sections .srow input[data-k=note],.sections .srow .mini{grid-column:2/4}
 .sections .hdr{display:none}
 .top{gap:8px}
 .logo{font-size:20px!important;flex:none}
 .gsearch{flex:1;min-width:0;max-width:none}
 .lang{flex:none}
 .lang button{padding:3px 8px}
}

/* firmware mode */
.only-doom{display:none}
body.fw-doom .only-doom{display:block}
body.fw-doom .only-official{display:none}
.lang.fw button.on{background:var(--ink);color:var(--panel)}
.navlogo{height:21px;width:auto;vertical-align:-6px;display:inline-block}
nav a.on .navlogo,nav a:hover .navlogo{filter:none}
.dtag{display:inline-block;font-family:var(--pixel);font-size:14px;letter-spacing:.06em;background:var(--device);color:#f4f4f0;border-radius:5px;padding:0 6px;vertical-align:2px;line-height:1.35}
.dconf{font-size:12.5px;color:var(--muted);margin-top:3px}
.dfeat{display:block;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.dfeat h3{margin:0 0 4px}
.dfeat p{margin:0 0 8px;font-size:13.5px}
.dfeat .dk{font-family:var(--pixel);font-size:17px;color:var(--orange);letter-spacing:.03em}
.dfeat:hover{border-color:var(--pink)}
@media (max-width:600px){.lang.fw button{padding:3px 6px;font-size:16px}}

#v-doom .only-doom + .grid{margin-top:24px}
@media (max-width:600px){
 .top{flex-wrap:wrap;row-gap:8px}
 .logo{order:1}
 .lang.fw{order:2;margin-left:auto}
 #langSw{order:3}
 .gsearch{order:4;flex-basis:100%}
}
.ddetail ul.clean li{font-size:14px}
.dadd .ddone{}
.dsteps{font-size:13.5px;margin:10px 0 0}
.dadd ul.clean li{font-size:14px}
.dadd[open] .num{background:var(--ink);color:var(--panel)}
.dadd .num{font-size:0}.dadd .num::before{content:"+";font-size:20px}.dadd[open] .num::before{content:"−"}
.star-b{font-size:20px;line-height:1;padding:4px 6px;cursor:pointer}
.star-b:hover{color:var(--pink)}

@media (max-width:860px){
 .sc tr{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--line)}
 .sc tr:first-child{display:none}
 .sc td{border:none;padding:6px 4px;width:auto!important}
 .sc td:nth-child(1){grid-column:1/2}
 .sc td:nth-child(4){grid-column:2/3;grid-row:1/3}
 .sc td:nth-child(2){grid-column:1/2;padding-top:0}
 .sc td:nth-child(3){display:none}
}

.phase .body,.step .st,.step .how{overflow-wrap:anywhere;min-width:0}
.step>div{min-width:0}
@media (max-width:380px){.k{white-space:normal}.phase .body{padding:0 12px 14px}}
@media (max-width:1000px){.planner{grid-template-columns:minmax(0,1fr)}}
.procgrp{margin:22px 0 10px;font-size:17px}
.procgrp .navlogo{height:22px;vertical-align:-6px;margin-right:4px}
.dinline{margin-top:12px}
.dil-h{font-family:var(--pixel);font-size:18px;letter-spacing:.05em;color:var(--orange);margin:4px 0 6px}
.dil{background:#f6f7e6;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.dil ol{margin:6px 0 0;padding-left:20px}.dil li{margin:4px 0;font-size:14px}
.dil p{font-size:13px;margin:8px 0 0}
body:not(.fw-doom) .dinline{display:none}
.sc tr.scgrp td{padding:16px 4px 6px;font-weight:700;font-size:15px;border-bottom:2px solid var(--ink)}
.sc tr.scgrp td .dim{font-weight:400;font-size:12.5px}
.sc tr.scgrp .navlogo{height:20px;vertical-align:-5px;margin-right:4px}
@media (max-width:860px){.sc tr.scgrp{display:block}.sc tr.scgrp td{display:block}}
.dproc,.dil.dl,.wf-doomstep{position:relative}
.dproc::after{content:"";position:absolute;top:12px;right:14px;width:62px;height:23px;background:var(--doomlogo) right top/contain no-repeat;pointer-events:none}
.dproc>summary{padding-right:90px}

.dlogo-s{height:16px;width:auto;display:block;margin-top:4px}
.sc tr.drow td:nth-child(3){display:table-cell!important}
@media (max-width:860px){.sc tr.drow{grid-template-columns:1fr auto auto}.sc tr.drow td:nth-child(3){display:block!important;grid-column:2/3;grid-row:1/2;padding-top:9px}.sc tr.drow td:nth-child(4){grid-column:3/4}}
.scsrc{margin-right:8px}
.scsrc .seg{padding:5px 12px;font-family:var(--pixel);font-size:17px}
.scsrc .navlogo{height:17px;vertical-align:-4px}
.scsrc .seg.on .navlogo{filter:invert(1) brightness(1.6)}
@media (max-width:860px){.sc tr.drow .catlbl{display:none}.sc tr.drow .dlogo-s{margin-top:0}.sc tr{grid-template-columns:minmax(0,1fr) auto}.sc tr.drow{grid-template-columns:minmax(0,1fr) auto auto}}
@media (max-width:860px){
 .sc tr,.sc tr.drow{grid-template-columns:minmax(0,1fr) auto}
 .sc tr.drow td:nth-child(3){grid-column:2/3;grid-row:1/2;padding-top:8px}
 .sc td:nth-child(4),.sc tr.drow td:nth-child(4){grid-column:2/3;grid-row:2/3;align-self:end}
 .sc td:nth-child(2){grid-row:2/3}
}

<template id="tpl-en"><main><!-- ============ 1. START ============ -->
<section class="view" id="v-start">
  <div class="hero"><div class="hero-t"><p class="eyebrow">INTERACTIVE GUIDE · SP-404MKII</p><h1>from sample<br>to live set</h1><p class="lead">This guide walks you through how to <b>prepare</b> your work on the SP-404MKII, how to <b>turn it into a structure</b>, and how to <b>perform it live</b>. Pick an approach, tick off steps and plan your banks and pads right here.</p><a class="press" href="#workflow"><span>▸</span> PRESS START</a></div><div class="hero-img" role="img" aria-label="Drawn SP-404MKII sampler among banana leaves"></div></div>

  <div class="callout">
    <b class="t">The core idea</b>
    The SP-404 is an <b>instrument you play from the pads</b>: a track doesn't live on a timeline, it's a <b>set of prepared parts in one bank</b> that you trigger, mute and reshape with effects. "Finished" doesn't mean an arrangement on a timeline – it means <b>a bank you can play from start to end</b>.
  </div>

  <h2>Mental model: what is what</h2>
  <div class="stack">
    <div class="lvl"><div class="n">PROJECT<small>16 on SD</small></div><div><b>= the whole live set / one album.</b> One project = one night. Shares project tempo, effects and 160 patterns.</div></div>
    <div class="lvl"><div class="n">BANK A–J<small>10 × 16 pads</small></div><div><b>= one track.</b> All parts of a track live in one bank. A bank has its own tempo and volume (<span class="k">SHIFT</span><span class="plus">+</span><span class="k">BANK</span>) – it works like a "mixer channel".</div></div>
    <div class="lvl"><div class="n">PAD 1–16<small>role, not sound</small></div><div><b>= a role in the track</b> (beat A, beat B, bass, hook, transition…). Same role on the same pad in every bank → your hands learn the layout.</div></div>
    <div class="lvl"><div class="n">PATTERN<small>16 × 10 banks</small></div><div><b>= a section of the track</b> (intro, verse, chorus, break). A pattern can play samples from any bank.</div></div>
    <div class="lvl"><div class="n">PATTERN CHAIN<small>16 / project</small></div><div><b>= the arrangement</b> – up to 16 patterns in a row. The equivalent of a song mode.</div></div>
    <div class="lvl"><div class="n">BUS FX 1–4<small>+ Input FX</small></div><div><b>= transitions and dynamics.</b> You play BUS 1/2 by hand, BUS 3/4 are master (compression, EQ, lo-fi).</div></div>
  </div>

  <h2>Six rules for finishing</h2>
  <div class="grid g3">
    <div class="card accent"><h3>1 · Bank = track</h3><p class="muted">No samples "for later" in random banks. If a bank isn't a track, it's a library – move it to a separate project.</p></div>
    <div class="card accent"><h3>2 · Fixed pad layout</h3><p class="muted">Row 1 drums, row 2 bass and harmony, row 3 melody and vocals, row 4 transitions. Always the same.</p></div>
    <div class="card accent"><h3>3 · Resample = commit</h3><p class="muted">As soon as you like something, resample it with effects to a new pad. The decision is made – you can't tweak it forever.</p></div>
    <div class="card accent"><h3>4 · Max. 4 sections</h3><p class="muted">Intro · A · B · Break/Outro. Enough for the stage. Variations come from effects and muting, not new parts.</p></div>
    <div class="card accent"><h3>5 · Timebox</h3><p class="muted">45 min per phase. When the alarm rings, move to the next phase – even if it's "not quite there". The timer is in the Practice tab.</p></div>
    <div class="card accent"><h3>6 · Done = I can play it</h3><p class="muted">A track is done when you can play it start to end three times in a row without getting stuck. Not when it's perfect.</p></div>
  </div>
  <p class="row" style="margin-top:22px"><a class="btn pri" href="#pristup">Choose an approach →</a> <a class="btn" href="#workflow">Straight to the workflow</a></p>
</section>

<!-- ============ 3. WORKFLOW ============ -->
<section class="view" id="v-workflow">
  <h1>Step-by-step workflow</h1>
  <p class="lead">Seven phases from an empty project to a recorded set. Tick the steps off – progress is saved in this browser. Repeat phases 2–5 for every track (bank).</p>
  <div class="row noprint" style="margin-bottom:6px">
    <span class="muted" style="font-size:14px">I'm working with approach:</span>
    <select id="wfFilter" style="width:auto"></select>
    <button class="btn sm ghost" id="wfReset">Reset checkmarks</button>
  </div>
  <p class="dim" style="font-size:13px;margin:4px 0 10px">Some steps only make sense for a particular approach (e.g. Pattern Chain only for B). Pick your approach from the Approach tab here and steps that don't apply are hidden. The tag on a step (e.g. <span class="tag">A,B,C</span>) shows which approaches it applies to; steps without a tag always apply.</p>
  <div class="callout neutral only-doom" style="margin:8px 0"><b>DOOM mode.</b> Steps tagged DOOM show DOOM OS controls (open with <span class="k">REMAIN</span> + <span class="k">SUB PAD</span>). Other steps work the same as in stock mode.</div>

  <p class="lead">Lay out tracks into banks, roles onto pads and sections into a structure. Then generate a stage cheat sheet. Everything is saved locally in your browser – back it up via Export.</p>

  <div class="row noprint" style="margin-bottom:14px">

<!-- ============ KONVERTOR ============ -->
<section class="view" id="v-konvertor">
  <h1>Converter & sound library</h1>

<!-- ============ 7. DOOM OS ============ -->
<section class="view" id="v-doom">
  <div class="only-official">
  <h1>Upgrade to DOOM OS?</h1>
  <p class="lead">Unofficial firmware by Klangfeld Labs built on Roland firmware 5.52. Free, at your own risk. Adds a graphical step sequencer, piano roll, synth engines, a mixer and p-locks – a classic groovebox workflow.</p>
  </div>
  <div class="only-doom">
  <h1>DOOM OS</h1>
  <p class="lead">DOOM mode is on: procedures, shortcuts, workflow and the Live cheat sheet show DOOM OS controls. Expand a feature below for the details and the step-by-step procedure.</p>
  </div>

  <h2>What DOOM OS adds</h2>
  <p class="dim" style="font-size:13px;margin-top:0">From the DOOM OS 0.7 manual (Klangfeld Labs); instrument and kit examples from Synth Anatomy's coverage of 0.7.</p>
  <div id="doomAdds">
    <details class="phase dadd"><summary><span class="num">+</span><div><div class="ttl">Instruments &amp; drum kits</div><div class="sub">20 synths and 11 drum kits inside the SP – no sampling needed.</div></div></summary><div class="body"><ul class="clean"><li><b>20 built-in instruments</b> “from drums to synths” – e.g. BASS, POLY, FM (two operators, selectable wave) and WAVE.</li><li><b>11 drum kits</b> – e.g. 909, 808, 606, CR78, 707, 727 (some load only 13–15 pads).</li><li>Editor: sections such as TONE, MOD, AMP, OUT; <span class="k">CTRL 1</span>–<span class="k">CTRL 3</span> set parameters, <span class="k">SHIFT</span> for fine steps.</li><li>Chromatic: <span class="k">SHIFT</span><span class="plus">+</span><span class="k">pad 4</span> in the editor, octave with the bank buttons.</li><li>Saved to the pad as a sample – plays in stock mode too.</li></ul><div class="dinline" data-procs="doominst"></div></div></details>
    <details class="phase dadd"><summary><span class="num">+</span><div><div class="ttl">Arpeggiator</div><div class="sub">Turns held notes into patterns – 11 types, 40 scales.</div></div></summary><div class="body"><ul class="clean"><li><b>Types:</b> UP, DOWN, U/D, RND, ORD, CHRD, CONV, DIV, PNKY, THMB, U/D+.</li><li><b>Rate:</b> 1/4 to 1/32 incl. triplets · <b>Gate:</b> 1–100 %.</li><li><b>40 scales</b> (e.g. CHR, MAJ, MIN, DOR), key C–B, up to 3 octaves up or down.</li><li><span class="k">HOLD</span> latches · PRINT ARP turns it into real notes.</li></ul><div class="dinline" data-procs="doomarp"></div></div></details>
    <details class="phase dadd"><summary><span class="num">+</span><div><div class="ttl">Recording</div><div class="sub">Rehearse first, then record in 4 modes.</div></div></summary><div class="body"><ul class="clean"><li><b>Rehearsal:</b> <span class="k">REC</span> = play without recording, second <span class="k">REC</span> = record.</li><li><b>SINGLE</b> – all pads play the selected track · <b>MULTI</b> – each pad its own track.</li><li><b>CHROMATIC</b> – pads as a keyboard (pad 5 = original pitch) · <b>16 VEL</b> – 16 velocities (pad 4 = 127, pad 13 = 1).</li><li><b>NEW NOTES</b> (<span class="k">SHIFT</span><span class="plus">+</span><span class="k">PATTERN EDIT</span>): quantize, swing, live/fixed velocity and length.</li><li>New patterns are 4/4; 5/4–7/4 patterns are view-only.</li></ul><div class="dinline" data-procs="record"></div></div></details>
    <details class="phase dadd"><summary><span class="num">+</span><div><div class="ttl">Sequencer &amp; editing</div><div class="sub">16-step grid, piano roll, parameter locks and pattern tools.</div></div></summary><div class="body"><ul class="clean"><li>16-step grid on the pads; per note: velocity, length, nudge (<span class="k">CTRL 1</span>–<span class="k">CTRL 3</span>).</li><li><b>Piano roll</b> per track · <b>Parameter locks</b>: up to 4096 per project.</li><li><b>Pattern tools:</b> QUANT (1/4–1/32, triplets), SWING 50–75, SHIFT ±16 steps, DOUBLE, HALVE, REVERSE, HUMAN 1–30, TRANSP ±12.</li><li><b>Undo</b> up to 11 steps, redo <span class="k">REMAIN</span><span class="plus">+</span><span class="k">PATTERN SELECT</span>.</li><li><b>Grid views</b> (<span class="k">SHIFT</span><span class="plus">+</span><span class="k">RECORD SETTING</span>): GRID, LABELS, BEATS, BOTH, ZOOM · Pattern Follow <span class="k">SHIFT</span><span class="plus">+</span><span class="k">HOLD</span>.</li></ul><div class="dinline" data-procs="doompiano,doomplock,doomtools,switch"></div></div></details>
    <details class="phase dadd"><summary><span class="num">+</span><div><div class="ttl">Mixer, EQ &amp; sidechain</div><div class="sub">A per-track mix, 3-band EQ and ducking.</div></div></summary><div class="body"><ul class="clean"><li><b>Mixer:</b> pan, bus (B1 / B2 / DRY), level, mute, solo per track.</li><li><b>EQ:</b> 3 bands, ±12 dB, 20 Hz–20 kHz (defaults 100 Hz / 1.2 kHz / 8 kHz), Q 0.3–10; up to 16 pads.</li><li><b>Sidechain:</b> threshold, ratio, release, make-up gain 0–6 dB; between DRY and BUS 1–4.</li></ul><div class="dinline" data-procs="mute,doomsc"></div></div></details>
    <details class="phase dadd"><summary><span class="num">+</span><div><div class="ttl">Bounce &amp; automation</div><div class="sub">Commit tracks to samples and record knob moves.</div></div></summary><div class="body"><ul class="clean"><li><b>Bounce in place:</b> CUT (pattern length), TAIL (until effects fade, max 30 s), LOOP (taken from the 2nd pass, loops seamlessly).</li><li>Bounce one track (<span class="k">RESAMPLE</span>) or everything you hear (<span class="k">SHIFT</span><span class="plus">+</span><span class="k">RESAMPLE</span>).</li><li><b>FX automation:</b> record with <span class="k">REC</span> ×2 on an effect page, edit step by step in <span class="k">SHIFT</span><span class="plus">+</span><span class="k">MARK</span>.</li></ul><div class="dinline" data-procs="resample,efxmotion"></div></div></details>
    <details class="phase dadd"><summary><span class="num">+</span><div><div class="ttl">Screen &amp; workflow helpers</div><div class="sub">Waveform, help mode, custom shortcuts, Boot to DOOM.</div></div></summary><div class="body"><ul class="clean"><li><b>Waveform display</b> of the last 2 s – output or selected track (<span class="k">SHIFT</span><span class="plus">+</span><span class="k">START/END</span>).</li><li><b>Help mode:</b> hold <span class="k">SHIFT</span> 3 s, then press any control to see what it does.</li><li><b>Custom shortcuts:</b> up to 8 (SYSTEM › SHORTCUT).</li><li><b>Boot to DOOM:</b> start straight into DOOM OS.</li></ul><div class="dinline" data-procs="doomopen"></div></div></details>
    <details class="phase dadd"><summary><span class="num">+</span><div><div class="ttl">Compatibility with stock firmware</div><div class="sub">What still plays when you go back to stock.</div></div></summary><div class="body"><ul class="clean"><li>Instruments are pad samples – they play in stock mode.</li><li><b>Parameter locks don't play</b> in stock mode (each step uses the plain sound).</li><li>Mixer pan / bus / level are pad settings – kept everywhere; pad EQ is heard on all screens.</li><li>Stock COPY and EXCHANGE of patterns work; locks travel with the copy within a project.</li></ul><div class="dinline" data-procs="chain"></div></div></details>
  </div>

  <div style="margin-top:18px">
    <div class="card"><h3>Watch out for</h3>
      <ul class="clean">
        <li>Unofficial – not supported by Roland; warranty impact isn't documented anywhere.</li>
        <li>Still in development (version 0.x); earlier versions were labelled alpha.</li>
        <li>Installed with its own patcher on top of the official update; per the author, original features remain.</li>
        <li>The manual doesn't describe returning to clean Roland firmware – verify that yourself.</li>
        <li>No song mode / arranger – structure still comes from patterns and switching between them.</li>
      </ul>
    </div>
  </div>

  <div class="only-official">
  <h2>Decision checklist</h2>
  <div class="card" id="doomCheck"></div>
  </div>

  <h2>How the workflow would change</h2>
  <div class="card" style="padding:6px 10px">
  <table class="stack-m">
    <tr><th>Step</th><th>Stock firmware</th><th>With DOOM OS</th></tr>
    <tr><td>Programming beats</td><td>Real-time REC or TR-REC without a clear grid</td><td>Grid + piano roll, note editing, p-locks</td></tr>
    <tr><td>Bass / melody</td><td>Sampling, Chromatic mode, Sound Generator</td><td>Synth engines right in the box + arpeggiator</td></tr>
    <tr><td>Switching sections</td><td>Pad during a pattern (at the end) / <span class="k">SUB PAD</span>+pad (instantly)</td><td><span class="k">PATTERN SELECT</span>+pad (at the end) / + <span class="k">SUB PAD</span> (instantly)</td></tr>
    <tr><td>Mixing</td><td>Bank volume, pad bus routing</td><td>Mixer (hold <span class="k">RECORD SETTING</span> 0.6 s), mute/solo, EQ</td></tr>
    <tr><td>Commit</td><td>RESAMPLE / BOUNCE</td><td>Bounce in place – the result is a regular sample, also plays in stock mode</td></tr>
  </table>
  </div>


  <h2>Where DOOM OS changes buttons</h2>
  <div class="callout blue" style="margin-top:0"><b class="t">Only inside DOOM OS</b>
  DOOM OS is a separate screen: open it with <span class="k">REMAIN</span><span class="plus">+</span><span class="k">SUB PAD</span> and close it with <span class="k">EXIT</span>. While you're in it, some combinations do something different than in stock mode. After closing, per the author, everything behaves like a regular SP-404MKII – so <b>the rest of this guide (Workflow, Live, Shortcuts) applies unchanged outside DOOM OS</b>. Differences below; in Shortcuts use the "DOOM OS" filter.</div>
  <div class="card" style="padding:6px 10px;overflow-x:auto"><table class="stack-m">
    <tr><th>Combination</th><th>Stock (this guide)</th><th>Inside DOOM OS</th></tr>
    <tr><td><span class="k">SHIFT</span><span class="plus">+</span><span class="k">REC</span></td><td>TR-REC (step recording)</td><td>Record mode select</td></tr>
    <tr><td><span class="k">SHIFT</span><span class="plus">+</span><span class="k">HOLD</span></td><td>Pause sample</td><td>Grid follow</td></tr>
    <tr><td><span class="k">SHIFT</span><span class="plus">+</span><span class="k">START/END</span></td><td>Markers / CHOP</td><td>Waveform display</td></tr>
    <tr><td><span class="k">SHIFT</span><span class="plus">+</span><span class="k">RECORD SETTING</span></td><td>Sound generator</td><td>Cycle grid views</td></tr>
    <tr><td>RECORD SETTING (hold)</td><td>Recording settings</td><td>Mixer (hold 0.6 s)</td></tr>
    <tr><td><span class="k">SHIFT</span><span class="plus">+</span><span class="k">MARK</span></td><td>—</td><td>FX automation</td></tr>
    <tr><td><span class="k">PATTERN SELECT</span></td><td>Pattern mode / back to sample mode</td><td>Start / stop playback</td></tr>
    <tr><td>pad (during pattern playback)</td><td>Queues next pattern</td><td>Queue is PATTERN SELECT + pad</td></tr>
    <tr><td>SHIFT (3 s)</td><td>—</td><td>Help mode</td></tr>
  </table></div>
  <p class="dim" style="font-size:13px">Per the DOOM OS 0.7 manual. Patterns made in DOOM OS also play in stock mode – instruments are stored as samples, only parameter locks don't play there.</p>
  <div class="callout blue only-official">
    <b class="t">Recommendation</b>
    First spend 2–3 weeks learning the stock workflow (phases 0–4) – pad layout, mute groups, resampling and transitions work the same with DOOM OS. Bring in DOOM OS when you're held back by <i>programming</i> notes, not by <i>structure</i>. <b>BACKUP</b> all projects before patching and only gig with it after a few rehearsals. Always bounce results to samples – they survive a return to stock.
  </div>

const LS_KEY='sp404guide.v1';
let S={lang:'cs',fw:'official',checks:{},wizard:{},appr:null,wfFilter:'*',bank:'A',banks:{},stars:{},setOrder:[],doom:{}};
try{const r=localStorage.getItem(LS_KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
S.lang='en';
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
const T=k=>UI[S.lang][k];
let APPROACHES,WIZARD,PHASES,LIVE,SHORTCUTS,SC_CATS,DOOM_Q,DRILLS,ROLES,TEMPLATE,DEFAULT_SECTIONS;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast(T('copied'))}catch(e){toast(T('copyFail'))}}
function modal(title,html){$('#mTitle').textContent=title;$('#mBody').innerHTML=html;$('#modal').classList.add('on')}
$('#mClose').onclick=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};

document.documentElement.style.setProperty('--doomlogo',`url("${DOOM_LOGO}")`);
function renderNav(){$('#nav').innerHTML=VIEW_IDS.slice(1).map((v,i)=>`<a href="#${v}" data-v="${v}"><b>0${i+1}</b>${v==='doom'?`<img class="navlogo" src="${DOOM_LOGO}" alt="DOOM OS">`:T('views')[i+1]}</a>`).join('')}
function route(scroll=true){
  let h=location.hash.slice(1); if(!VIEW_IDS.includes(h)) h='start';
  $$('section.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+h));
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===h));
  if(h==='live') renderCue();
  if(scroll) window.scrollTo(0,0);

}
window.addEventListener('hashchange',()=>route());


// ---------- approaches ----------
function meter(n){return `<div class="meter">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'f':''}"></i>`).join('')}</div>`}
function renderAppr(){
  $('#apprCards').innerHTML=APPROACHES.map(a=>`<div class="card appr ${S.appr===a.id?'sel':''}" data-a="${a.id}">
    <div class="letter">${a.id}</div><h3>${a.name}</h3><p class="muted" style="font-size:14px;min-height:44px">${a.short}</p>
    ${Object.entries(a.m).map(([k,v])=>`<div class="mrow"><span>${T('m')[k]}</span>${meter(v)}</div>`).join('')}</div>`).join('');
  $$('.appr').forEach(c=>c.onclick=()=>{S.appr=c.dataset.a;save();renderAppr();$('#apprDetail').scrollIntoView({behavior:'smooth',block:'start'})});
  const ch=T('cmpH');
  $('#apprTable').innerHTML=`<tr>${ch.map(x=>`<th>${x}</th>`).join('')}</tr>`+APPROACHES.map(a=>`<tr><td><b>${a.id} · ${a.name}</b><br><button class="btn sm ghost" data-det="${a.id}" style="margin-top:6px">${T('showDetail')}</button></td><td>${a.who}</td><td data-l="${ch[2]}" class="pro"><ul style="padding-left:16px;margin:0;font-size:14px">${a.pros.map(x=>`<li>${x}</li>`).join('')}</ul></td><td data-l="${ch[3]}" class="con"><ul style="padding-left:16px;margin:0;font-size:14px">${a.cons.map(x=>`<li>${x}</li>`).join('')}</ul></td><td data-l="${ch[4]}">${meter(a.m.riziko)}</td></tr>`).join('');
  $$('[data-det]').forEach(b=>b.onclick=()=>{S.appr=b.dataset.det;save();renderAppr();$('#apprDetail').scrollIntoView({behavior:'smooth',block:'start'})});
  const a=APPROACHES.find(x=>x.id===S.appr);
  if(!a){$('#apprDetail').innerHTML='';return}
  $('#apprDetail').innerHTML=`<div class="card" style="border-color:var(--orange)">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${a.id} · ${a.name}</h2>
    <div class="row"><button class="btn sm" id="useAppr">${T('filterWf')}</button></div></div>
    <p class="muted">${a.who}</p>
    <div class="grid g2">
      <div><h3>${T('prep')}</h3><ol>${a.setup.map(x=>`<li style="margin:6px 0">${kx(x)}</li>`).join('')}</ol></div>
      <div><h3>${T('play')}</h3><ul>${a.live.map(x=>`<li style="margin:6px 0">${kx(x)}</li>`).join('')}</ul>
        <div class="grid g2" style="gap:10px;margin-top:12px">
          <div><b style="color:var(--green)">${T('pros')}</b><ul style="padding-left:18px;font-size:14px">${a.pros.map(x=>`<li>${x}</li>`).join('')}</ul></div>
          <div><b style="color:var(--red)">${T('cons')}</b><ul style="padding-left:18px;font-size:14px">${a.cons.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        </div></div>
    </div></div>`;
  $('#useAppr').onclick=()=>{S.wfFilter=a.id;save();renderWorkflow();location.hash='workflow'};
}
function wizScores(){const sc={A:0,B:0,C:0,D:0,E:0};WIZARD.forEach((w,i)=>{const p=w.o[S.wizard[i]][1];for(const k in p)sc[k]+=p[k]});return sc}
function renderWizard(){
  const done=WIZARD.every((_,i)=>S.wizard[i]!=null);
  let html=`<h3 style="margin-top:0">${T('quick')}</h3>`+WIZARD.map((w,i)=>`<div class="q"><b>${i+1}. ${w.q}</b><div class="opts">${w.o.map((o,j)=>`<div class="opt ${S.wizard[i]===j?'on':''}" data-q="${i}" data-o="${j}">${o[0]}</div>`).join('')}</div></div>`).join('');
  if(done){
    const sc=wizScores(); const max=Math.max(...Object.values(sc))||1;
    const ranked=Object.entries(sc).sort((a,b)=>b[1]-a[1]);
    const top=APPROACHES.find(a=>a.id===ranked[0][0]), second=APPROACHES.find(a=>a.id===ranked[1][0]);
    html+=`<div class="callout neutral"><b class="t">${T('rec')} ${top.id} · ${top.name}</b>
      ${T('complement')} <b>${second.id} · ${second.name}</b>. ${T('hybrid')}
      <div style="margin-top:12px">${ranked.map(([k,v])=>{const a=APPROACHES.find(x=>x.id===k);return `<div class="result-bar"><span>${k} · ${a.name}</span><div class="track"><i style="width:${v/max*100}%"></i></div><span class="dim">${v}</span></div>`}).join('')}</div>

    for(let i=0;i<N;i++){const v=(x[s+i]||0);e+=v*v;re[i]=v*win[i]}

    const rel=flux[i]/(msum[i]+1e-9);if(fn[i]>fn[i-1]&&fn[i]>=fn[i+1]&&fn[i]>med+0.12&&fn[i]>0.08&&rel>0.25&&rms[i]>peak*0.03){if(!onsets.length||i-onsets[onsets.length-1]>4)onsets.push(i)}}
  return {centroid,flatness,lowRatio,attackMs,endRatio,onsets:onsets.length,flux:fn,hop:H/sr};

function estimateBpm(f,dur){
  const ac=lag=>{let s=0;for(let i=0;i+lag<f.flux.length;i++)s+=f.flux[i]*f.flux[i+lag];return s};
  const score=bpm=>{const lag=60/bpm/f.hop;const l=Math.round(lag);return Math.max(ac(l-1),ac(l),ac(l+1))+0.5*ac(Math.round(lag*2))};

  else{for(let b=65;b<=185;b+=0.5){const sc=score(b);if(sc>bs){bs=sc;best=b}}}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

async function makeZip(files){ // [{path, blob}]
  const parts=[],central=[];let off=0;const enc=new TextEncoder();
  for(const f of files){
    const data=new Uint8Array(await f.blob.arrayBuffer()),name=enc.encode(f.path),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(8,0,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
    parts.push(h.buffer,name,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    central.push(c.buffer,name); off+=30+name.length+data.length;
  }
  const csize=central.reduce((a,b)=>a+(b.byteLength??b.length),0);
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,e.buffer],{type:'application/zip'});
}

async function processFiles(files){
  const st=$('#cvStatus');const o={...S.conv};
  const ctx=new OfflineAudioContext(1,1,48000);
  let i=0;
  for(const entry of files){
    const file=entry.file||entry; const rel=(entry.rel!=null?entry.rel:(file.webkitRelativePath||'').split('/').slice(0,-1).join('/'));
    i++; st.textContent=CT('processing')(i,files.length);
    const it={rel,id:Date.now()+'-'+Math.random().toString(36).slice(2,7),orig:file.name,base:file.name.replace(/\.[^.]+$/,''),opts:o,created:Date.now()};
    try{
      const ab=await file.arrayBuffer();
      const buf=await toBuffer48(ab);
      let chs=[];for(let c=0;c<buf.numberOfChannels;c++)chs.push(buf.getChannelData(c).slice());
      if(chs.length>2)chs=chs.slice(0,2);
      it.srcCh=buf.numberOfChannels;
      if(!o.mono&&o.smartMono&&chs.length===2){let d=0,e=0;const L=chs[0],R=chs[1];for(let k=0;k<L.length;k++){const x=L[k]-R[k];d+=x*x;e+=L[k]*L[k]+R[k]*R[k]}if(e===0||d/e<1e-6){chs=[L];it.smart=1}}
      if(o.mono&&chs.length>1){const m=new Float32Array(chs[0].length);for(let k=0;k<m.length;k++)m[k]=(chs[0][k]+chs[1][k])/2;chs=[m]}
      const mono=chs.length>1?chs[0].map((v,k)=>(v+chs[1][k])/2):chs[0];
      let dur=mono.length/48000;
      let f=null; it.cat='other';
      if(CATEGORIZE){f=analyze(mono,48000);const byName=kwCat(file.name);it.cat=byName||classify(f,dur);it.src=byName?'name':'audio'}
      const loopy=CATEGORIZE?(it.cat==='dloop'||it.cat==='mloop'):!o.trimEnd;
      if(o.trim){
        let pk=0;for(const ch of chs)for(let k=0;k<ch.length;k++)pk=Math.max(pk,Math.abs(ch[k]));
        const th=Math.max(pk*0.003,1e-5);let s=0,e=chs[0].length-1;
        const amp=k=>Math.max(...chs.map(ch=>Math.abs(ch[k])));
        while(s<e&&amp(s)<th)s++; s=Math.max(0,s-96);
        if(!loopy){while(e>s&&amp(e)<th)e--; e=Math.min(chs[0].length-1,e+480)}
        chs=chs.map(ch=>ch.slice(s,e+1));
        if(!loopy){const fd=Math.min(240,chs[0].length);for(const ch of chs)for(let k=0;k<fd;k++)ch[ch.length-1-k]*=k/fd}
        dur=chs[0].length/48000;
      }
      if(CATEGORIZE&&loopy) it.bpm=estimateBpm(f,dur);
      if(o.norm){let pk=0;for(const ch of chs)for(let k=0;k<ch.length;k++)pk=Math.max(pk,Math.abs(ch[k]));if(pk>0){const g=0.891/pk;for(const ch of chs)for(let k=0;k<ch.length;k++)ch[k]*=g}}
      it.dur=dur; it.ch=chs.length; it.wav=toWav(chs,48000); it.size=it.wav.size;
      it.warn=dur<0.1?'short':'';
      it.name=outName(it);
    }catch(e){it.err=1;it.cat='other';it.name=file.name}
    LIB.unshift(it); if(!it.err) idbPut(it); renderLib();
    await new Promise(r=>setTimeout(r,0));
  }
  st.textContent=CT('done')(files.length)+(SKIPPED?' · '+CT('skipped')(SKIPPED):'');
}

async function walkEntry(en,dir,out){
  if(en.isFile){const f=await new Promise((res,rej)=>en.file(res,rej)).catch(()=>null);if(f&&isAudio(f))out.push({file:f,rel:dir});if(out.length%25===0&&$('#cvStatus'))$('#cvStatus').textContent=CT('reading')(out.length);return}
  if(en.isDirectory){const path=dir?dir+'/'+en.name:en.name;const rd=en.createReader();
    while(true){const batch=await new Promise((res,rej)=>rd.readEntries(res,rej)).catch(()=>[]);if(!batch.length)break;for(const c of batch)await walkEntry(c,path,out)}}
}
const isAudio=f=>{const ok=isAudio0(f);if(!ok&&!/^\./.test(f.name))SKIPPED++;return ok};

  return LIB.filter(it=>{
    if(cvCat!=='all'&&it.cat!==cvCat)return false;
    if(!q)return true;
    const C=CATS[it.cat]||CATS.other;
    const base=[it.name,it.orig,it.rel||'',it.ch===1?'mono':'stereo',it.warn?'short kratky':''];
    const extra=CATEGORIZE?[C.code,C.cs,C.en,it.bpm?Math.round(it.bpm)+'bpm':'',(it.cat==='dloop'||it.cat==='mloop')?'loop':'one-shot oneshot']:[];

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let SIDX=[];
function buildIndex(){
  SIDX=[]; let n=0; const V=T('views');
  const viewName=id=>V[VIEW_IDS.indexOf(id)]||'';
  const sel='.lvl, .card.accent, .callout, table.stack-m tr, .live-t tr, ul.clean > li, .step, .appr, details.proc, details.dadd';
  $$('section.view').forEach(sec=>{
    const view=sec.id.slice(2); if(view==='konvertor'||view==='planovac') return;
    sec.querySelectorAll(sel).forEach(el=>{
      if(el.closest('#wizard')||el.closest('#doomCheck')) return;
      if(el.parentElement.closest('.callout, .appr, details.proc, .step')) return;
      if(el.tagName==='TR'&&el.querySelector('th')) return;
      const cl=el.cloneNode(true); cl.querySelectorAll('.num,.tag,.dtag').forEach(x=>x.remove()); cl.querySelectorAll('li,td,div,p,summary,h3,b,span.k').forEach(x=>x.append(' ')); let text=cl.textContent.replace(/\s+/g,' ').replace(/\s*\+\s*/g,'+').replace(/ ([,.)])/g,'$1').trim(); if(text.length<4) return;
      let title='';
      const h=el.querySelector('.ttl')||el.querySelector('h3')||el.querySelector('b.t')||el.querySelector('.n'); if(h){const hc=h.cloneNode(true);hc.querySelectorAll('.dtag').forEach(x=>x.remove());hc.querySelectorAll('small').forEach(x=>x.prepend(' · '));title=hc.textContent.replace(/\s+/g,' ').trim()}
      if(!title){const c=el.closest('.card'); const ch=c&&c.querySelector('h3'); if(ch) title=ch.textContent.trim()}
      if(!title){let p=el.closest('.card')||el; while(p&&p.previousElementSibling&&p.previousElementSibling.tagName!=='H2')p=p.previousElementSibling; const h2=p&&p.previousElementSibling; title=h2?h2.textContent.trim():sec.querySelector('h1').textContent.trim()}
      if(el.classList.contains('step')){const ph=el.closest('details.phase'); const st=el.querySelector('.st').cloneNode(true); st.querySelectorAll('.tag,.dtag').forEach(x=>x.remove()); title=st.textContent.trim(); }
      if(title&&text.startsWith(title)) text=text.slice(title.length).trim();
      SIDX.push({view,el,title,text,ctx:viewName(view),proc:el.classList.contains('proc'),hay:norm(title+' '+text)});
    });
  });
  scList().forEach(({r,conf})=>SIDX.push({view:'zkratky',sc:r[1],title:r[1],text:r[0].replace(/\+/g,' + ')+(conf?' · DOOM: '+conf:''),ctx:viewName('zkratky'),hay:norm(r[0]+' '+r[1]+' '+SC_CATS[r[2]]+' '+(conf||''))}));
}
function tokMatch(hay,t){if(hay.includes(t))return true;const s=SYN[t];return !!(s&&s.some(x=>hay.includes(norm(x))))}
function runSearch(q){
  const toks=norm(q).split(/[^a-z0-9/]+/).filter(t=>t.length>1); if(!toks.length) return [];
  const res=[];
  for(const it of SIDX){ if(!toks.every(t=>tokMatch(it.hay,t))) continue;
    const th=norm(it.title); let sc=0; toks.forEach(t=>{if(th.includes(t))sc+=3; else sc+=1});
    if(it.proc) sc+=2; if(it.sc!=null) sc+=1; res.push({it,sc}) }
  return res.sort((a,b)=>b.sc-a.sc).slice(0,30).map(r=>r.it);
}
function snippet(text,toks){
  const nt=norm(text); let pos=-1; for(const t of toks){pos=nt.indexOf(t);if(pos>=0)break}
  let s=Math.max(0,pos-50); let out=(s>0?'…':'')+text.slice(s,s+150)+(text.length>s+150?'…':'');
  let h=esc(out); toks.forEach(t=>{ if(t.length<2)return; const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); h=h.replace(re,'<mark>$1</mark>') });
  return h;
}
function renderResults(){
  const q=$('#gSearch').value, box=$('#gResults');
  if(!q.trim()){box.classList.remove('on');return}
  if(!SIDX.length) buildIndex();
  const toks=norm(q).split(/[^a-z0-9/]+/).filter(t=>t.length>1);
  const res=runSearch(q);
  box.innerHTML=res.length?res.map((r,i)=>`<button class="gr" data-i="${i}"><span class="gr-ctx">${esc(r.ctx)}${r.proc?' · '+esc(T('procTag')):''}</span><b>${esc(r.title.slice(0,90))}</b><span class="gr-s">${snippet(r.text,toks)}</span></button>`).join(''):`<div class="dim" style="padding:12px">${T('noResults')}</div>`;
  box.classList.add('on');
  $$('#gResults .gr').forEach(b=>b.onclick=()=>goResult(res[+b.dataset.i]));
}
function flash(el){if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
function goResult(r){
  $('#gResults').classList.remove('on'); $('#gSearch').blur();
  if(location.hash!=='#'+r.view) location.hash=r.view; else route(false);
  setTimeout(()=>{
    if(r.sc!=null){scCat='all';$('#scSearch').value=r.sc;renderSC();flash($('#scTable tr:nth-child(2)'));return}
    const el=r.el; if(!el||!el.isConnected){buildIndex();return}
    const d=el.closest('details'); if(d) d.open=true; if(el.tagName==='DETAILS') el.open=true;
    flash(el);
  },80);
}
function procList(){
  if(!isDoom()) return PROC_DEF.map(x=>({...x,src:'roland'}));
  const ex=Object.fromEntries(DOOM_PROC.extra.map(x=>[x.id,{...x,src:'doom'}]));
  const base=Object.fromEntries(PROC_DEF.map(x=>[x.id,x]));
  const ov=id=>({...base[id],...DOOM_PROC.over[id],src:'doom'});
  const doom=[ex.doomopen,ov('record'),ov('switch'),ov('patbank'),ex.doominst,ex.doompiano,ex.doomarp,ex.doomplock,ex.doomtools,ov('mute'),ex.doomsc,ov('resample'),ov('efxmotion'),ov('chain')];
  const rest=PROC_DEF.filter(x=>!DOOM_PROC.over[x.id]).map(x=>({...x,src:'roland'}));
  return doom.concat(rest);
}
function renderInlineProcs(){
  const L=Object.fromEntries(procList().map(x=>[x.id,x]));
  $$('.dinline').forEach(box=>{
    const ps=box.dataset.procs.split(',').map(id=>L[id]).filter(Boolean);
    box.innerHTML=ps.length?`<div class="dil-h">${T('stepByStep')}</div>`+ps.map(p=>{const [t,what,steps,note]=p[S.lang];const d=p.src==='doom';return `<div class="dil ${d?'dl':''}"><b>${t}</b><ol>${steps.map(x=>`<li>${kx(x)}</li>`).join('')}</ol>${note?`<p class="muted">${kx(note)}</p>`:''}</div>`}).join(''):'';
  });
}
function renderProcs(){
  renderInlineProcs();
  const box=$('#procList'); if(!box) return;
  const L=procList().filter(x=>typeof scSrc==='undefined'||scSrc==='both'||(scSrc==='doom')===(x.src==='doom')); let lastSrc=null;
  box.innerHTML=L.map(p=>{const hdr=isDoom()&&p.src!==lastSrc?(lastSrc=p.src,`<h3 class="procgrp">${p.src==='doom'?'<img class="navlogo" src="'+DOOM_LOGO+'" alt="DOOM OS"> procedures':'SP Original procedures <span class="dim" style="font-weight:400;font-size:13px">– work the same with DOOM OS installed (outside the DOOM OS screen)</span>'}</h3>`):'';return hdr+(()=>{const [t,what,steps,note]=p[S.lang];const d=p.src==='doom';return `<details class="proc phase ${d?'dproc':''}" id="proc-${p.id}"><summary><span class="num">↳</span><div><div class="ttl">${t}</div><div class="sub">${what}</div></div></summary><div class="body"><ol style="margin:0;padding-left:18px">${steps.map(s=>`<li style="margin:5px 0">${kx(s)}</li>`).join('')}</ol>${note?`<p class="muted" style="font-size:13.5px;margin:10px 0 0">${kx(note)}</p>`:''}<p style="margin:10px 0 0;font-size:13px"><a href="${d?DOOM_URL:MAN+p.url+'.html'}" target="_blank" rel="noopener">${d?T('doomManLink'):T('manLink')}</a></p></div></details>`})()}).join('');
}
function initSearch(){
  const s=$('#gSearch'); s.placeholder=T('searchPh');
  s.oninput=renderResults; s.onfocus=()=>{buildIndex(); if(s.value.trim())renderResults()};
  s.onkeydown=e=>{if(e.key==='Escape'){s.value='';renderResults();s.blur()} if(e.key==='Enter'){const f=$('#gResults .gr');if(f)f.click()}};
  document.addEventListener('click',e=>{if(!e.target.closest('.gsearch'))$('#gResults').classList.remove('on')});
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();s.focus()}});
}

const LV_UI={
 cs:{level:'Úroveň',goal:'Cíl',exam:'Zkouška',examDone:'Zkouška splněna',locked:n=>`Zamčeno – nejdřív splň zkoušku úrovně ${n}.`,peek:'Zobrazit i tak',done:'Hotovo',progress:(a,b)=>`${a}/${b}`},
 en:{level:'Level',goal:'Goal',exam:'Exam',examDone:'Exam passed',locked:n=>`Locked – pass the level ${n} exam first.`,peek:'Show anyway',done:'Done',progress:(a,b)=>`${a}/${b}`}
};
function renderLevels(){
  const box=$('#levels'); if(!box) return;
  S.train=S.train||{d:{},x:{},peek:{}};
  const L=LEVELS[S.lang], U=LV_UI[S.lang];
  let unlocked=true;
  box.innerHTML=L.map((lv,li)=>{
    const done=lv.drills.filter((_,di)=>S.train.d[li+'-'+di]).length, ex=!!S.train.x[li];
    const isLocked=!unlocked&&!S.train.peek[li]; const wasLocked=!unlocked;
    unlocked=unlocked&&ex;
    const pct=Math.round((done+(ex?1:0))/(lv.drills.length+1)*100);
    return `<details class="phase lvlbox ${ex?'done':''} ${wasLocked?'locked':''}" data-l="${li}" ${(!wasLocked&&!ex)||S.train.peek[li]?'open':''}>
      <summary><span class="num">${ex?'✓':li+1}</span><div><div class="ttl">${U.level} ${li+1} · ${lv.t}</div><div class="sub">${U.goal}: ${lv.goal}</div></div>
      <span class="cnt"><span class="lvbar"><i style="width:${pct}%"></i></span> ${U.progress(done+(ex?1:0),lv.drills.length+1)}</span></summary>
      <div class="body">${isLocked?`<p class="dim" style="margin:6px 0">${U.locked(li)} <button class="btn sm ghost" data-peek="${li}">${U.peek}</button></p>`:
       lv.drills.map((d,di)=>{const id=li+'-'+di;return `<label class="step ${S.train.d[id]?'ok':''}"><input type="checkbox" data-d="${id}" ${S.train.d[id]?'checked':''}><div><div class="st">${d.t} <span class="tag" style="margin-left:6px">${d.time}</span></div><div class="how">${kx(d.d)}</div></div></label>`}).join('')+
       `<div class="exam ${ex?'ok':''}"><label class="step" style="border:none"><input type="checkbox" data-x="${li}" ${ex?'checked':''}><div><div class="st">${ex?U.examDone:U.exam}</div><div class="how">${kx(lv.exam)}</div></div></label></div>`}
      </div></details>`}).join('');
  $$('#levels [data-d]').forEach(c=>c.onchange=()=>{S.train.d[c.dataset.d]=c.checked;save();renderLevels()});
  $$('#levels [data-x]').forEach(c=>c.onchange=()=>{S.train.x[c.dataset.x]=c.checked;save();renderLevels()});
  $$('#levels [data-peek]').forEach(b=>b.onclick=e=>{e.preventDefault();S.train.peek[b.dataset.peek]=1;save();renderLevels()});
}

const isDoom=()=>S.fw==='doom';
function renderDoomFeat(){
  const box=$('#doomFeat'); if(!box) return;
  box.innerHTML=DOOM_FEAT[S.lang].map(f=>`<button class="card dfeat" data-p="${f[3]}"><h3>${f[0]}</h3><p class="muted">${f[1]}</p><span class="dk">${esc(f[2])}</span></button>`).join('');
  $$('#doomFeat .dfeat').forEach(b=>b.onclick=()=>{location.hash='zkratky';setTimeout(()=>{const d=$('#proc-'+b.dataset.p);if(d){d.open=true;flash(d)}},120)});
}
